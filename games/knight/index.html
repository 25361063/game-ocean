          const pd = 40 + Math.random() * 80;
          const px = e.x + Math.cos(pa) * pd;
          const py = e.y + Math.sin(pa) * pd;
          // Poison zone: damages knight if standing in it
          if (Math.hypot(px - knight.x, py - knight.y) < 50 && knight.invincible <= 0) {
            const poisonDmg = Math.floor(5 * (e.dmgMult || 1) * (1 - (knight.dmgReduce || 0)));
            knight.hp -= poisonDmg;
            knight.invincible = 20;
            addFloatingText(`-${poisonDmg}`, knight.x, knight.y - 30, '#6c5ce7');
          }
          for (let j = 0; j < 5; j++) {
            particles.push({ x: px + (Math.random()-0.5)*20, y: py + (Math.random()-0.5)*20, vx: (Math.random()-0.5)*1.5, vy: -0.5-Math.random(), life: 30 + Math.random()*20, color: '#6c5ce7', size: 3 + Math.random()*2 });
          }
        }
        e.skillCooldown = 120;
        addFloatingText('毒雾弥漫!', e.x, e.y - 40 * e.size, '#6c5ce7', 30);
        screenShake = 4;
      }
      // Poison trail while moving
      if (e.type === 'bossPoison' && gameTime % 8 === 0) {
        particles.push({ x: e.x + (Math.random()-0.5)*15, y: e.y + (Math.random()-0.5)*15, vx: 0, vy: -0.3, life: 40, color: '#6c5ce7', size: 2 });
      }

      // DZW雷: Lightning strike at knight position
      if (e.type === 'bossThunder' && e.skillCooldown <= 0 && dist < 400) {
        // Warn with ground marker, then strike
        const strikeX = knight.x, strikeY = knight.y;
        // Delayed strike: first warn, then damage after short delay
        for (let k = 0; k < 8; k++) {
          const a = (Math.PI * 2 / 8) * k;
          particles.push({ x: strikeX + Math.cos(a)*30, y: strikeY + Math.sin(a)*30, vx: 0, vy: 0, life: 30, color: '#f39c12', size: 3 });
        }
        // After brief delay, deal damage
        setTimeout(() => {
          if (gameOver) return;
          const strikeDist = Math.hypot(strikeX - knight.x, strikeY - knight.y);
          if (strikeDist < 50 && knight.invincible <= 0) {
            const thunderDmg = Math.floor(20 * (e.dmgMult || 1) * (1 - (knight.dmgReduce || 0)));
            knight.hp -= thunderDmg;
            knight.invincible = 40;
            screenShake = 10;
            addFloatingText(`-${thunderDmg}`, knight.x, knight.y - 30, '#f39c12');
          }
          // Lightning visual
          for (let k = 0; k < 15; k++) {
            const a = Math.random() * Math.PI * 2;
            const s = 3 + Math.random() * 5;
            particles.push({ x: strikeX, y: strikeY, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 20, color: '#f39c12', size: 3 + Math.random()*3 });
          }
          // Chain lightning to nearby enemies (heals them slightly — boss synergy)
          for (const other of enemies) {
            if (other === e) continue;
            const cd = Math.hypot(other.x - strikeX, other.y - strikeY);
            if (cd < 100) {
              for (let j = 0; j < 3; j++) {
                particles.push({ x: other.x, y: other.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 12, color: '#f39c12', size: 2 });
              }
            }
          }
        }, 400);
        e.skillCooldown = 180;
        addFloatingText('雷霆一击!', e.x, e.y - 40 * e.size, '#f39c12', 30);
        screenShake = 6;
        // Electric particles on boss
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * Math.PI * 2;
          particles.push({ x: e.x + Math.cos(a)*20, y: e.y + Math.sin(a)*20, vx: Math.cos(a)*3, vy: Math.sin(a)*3, life: 15, color: '#f39c12', size: 3 });
        }
      }
    }

    // Melee attack knight
    if (dist < 30 * e.size && e.attackCooldown <= 0 && knight.invincible <= 0) {
      let baseDmg = 10 + Math.floor(Math.random() * 6) + Math.floor(wave * 2);
      let hitInvincible = 30;
      let hitCooldown = 60;
      let shakeAmt = 6;

      // Tank: charge hit deals 2x damage + knockback
      if (e.type === 'tank' && e._chargeState === 'charging') {
        baseDmg *= 2;
        shakeAmt = 12;
        const kbx = (dx2 / dist) * 60;
        const kby = (dy2 / dist) * 60;
        knight.x += kbx; knight.y += kby;
        addFloatingText('冲撞!', knight.x, knight.y - 50, '#636e72', 30);
        e._chargeState = 'approach';
      }
      // Fast: quick attacks, short cooldown
      if (e.type === 'fast') {
        hitCooldown = 25;
        hitInvincible = 15;
      }
      // Assassin: backstab bonus (always crits from behind)
      if (e.type === 'assassin') {
        baseDmg = Math.floor(baseDmg * 1.5);
        addFloatingText('背刺!', knight.x, knight.y - 50, '#1a1a2e', 25);
      }

      const dmg = Math.floor(baseDmg * (e.dmgMult || 1) * (1 - (knight.dmgReduce || 0)));
      knight.hp -= dmg;
      knight.invincible = hitInvincible;
      e.attackCooldown = hitCooldown;
      screenShake = shakeAmt;
      playSound('hurt');
      addFloatingText(`-${dmg}`, knight.x, knight.y - 30, '#e94560');
      for (let j = 0; j < 4; j++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
          x: knight.x, y: knight.y,
          vx: Math.cos(a) * 2, vy: Math.sin(a) * 2,
          life: 15, color: '#e94560', size: 3
        });
      }
      if (knight.hp <= 0) {
        gameOver = true;
        screenShake = 15;
        showGameOver();
      }
    }
    if (e.attackCooldown > 0) e.attackCooldown--;
  }

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += 0.3;
    p.life--;

    // Out of bounds or expired
    if (p.life <= 0 || p.x < -50 || p.x > W() + 50 || p.y < -50 || p.y > H() + 50) {
      projectiles.splice(i, 1);
      continue;
    }
    // Obstacle collision
    let hitObstacle = false;
    for (const ob of obstacles) {
      if (Math.abs(p.x - ob.x) < ob.w / 2 + 5 && Math.abs(p.y - ob.y) < ob.h / 2 + 5) {
        hitObstacle = true;
        for (let k = 0; k < 3; k++) {
          particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 10, color: '#dfe6e9', size: 2 });
        }
        break;
      }
    }
    if (hitObstacle) { projectiles.splice(i, 1); continue; }

    // Trail particles
    if (Math.random() < 0.5) {
      particles.push({
        x: p.x + (Math.random() - 0.5) * 6,
        y: p.y + (Math.random() - 0.5) * 6,
        vx: -p.vx * 0.1 + (Math.random() - 0.5),
        vy: -p.vy * 0.1 + (Math.random() - 0.5),
        life: 10, color: '#e17055', size: 2
      });
    }

    // Hit detection against enemies
    for (const e of enemies) {
      if (p.hitSet.has(e)) continue;
      const d = Math.hypot(e.x - p.x, e.y - p.y);
      if (d < 25) {
        if (tryDodge(e)) continue;
        let dmg = Math.floor(p.damage * (knight.atkMult || 1));
        let isCrit = false;
        if (knight.critChance > 0 && Math.random() < knight.critChance) {
          dmg = Math.floor(dmg * 2);
          isCrit = true;
        }
        e.hp -= dmg;
        e.hitFlash = 8;
        screenShake = 3;
        p.hitSet.add(e);
        if (knight.lifesteal > 0) {
          const heal = Math.floor(dmg * knight.lifesteal);
          knight.hp = Math.min(knight.maxHp, knight.hp + heal);
        }

        comboCount++;
        comboTimer = 90;
        const comboMult = Math.min(comboCount, 5);
        if (comboCount > 1) {
          addFloatingText(`${comboCount}连击! x${comboMult}`, e.x, e.y - 30, '#ffdd57');
        }
        addFloatingText(`-${dmg}${isCrit ? ' 暴击!' : ''}`, e.x, e.y - 10, isCrit ? '#ffeaa7' : '#ff4757');

        // Knockback from projectile
        const ea = Math.atan2(e.y - p.y, e.x - p.x);
        e.x += Math.cos(ea) * 10;
        e.y += Math.sin(ea) * 10;

        // Hit particles
        for (let j = 0; j < 4; j++) {
          const a = ea + (Math.random() - 0.5) * 1.5;
          const s = 2 + Math.random() * 2;
          particles.push({
            x: e.x, y: e.y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 15, color: '#e17055', size: 2 + Math.random() * 2
          });
        }

        // Non-piercing: remove on hit
        if (!p.piercing) {
          projectiles.splice(i, 1);
          break;
        }
      }
    }
  }

  // Enemy projectiles
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    // Out of bounds or expired
    if (p.life <= 0 || p.x < -50 || p.x > W() + 50 || p.y < -50 || p.y > H() + 50) {
      enemyProjectiles.splice(i, 1);
      continue;
    }
    // Obstacle collision
    let hitOb = false;
    for (const ob of obstacles) {
      if (Math.abs(p.x - ob.x) < ob.w / 2 + 5 && Math.abs(p.y - ob.y) < ob.h / 2 + 5) {
        hitOb = true;
        for (let k = 0; k < 3; k++) {
          particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 10, color: p.color || '#7bed9f', size: 2 });
        }
        break;
      }
    }
    if (hitOb) { enemyProjectiles.splice(i, 1); continue; }

    // Trail
    if (Math.random() < 0.3) {
      particles.push({
        x: p.x + (Math.random() - 0.5) * 4, y: p.y + (Math.random() - 0.5) * 4,
        vx: 0, vy: 0, life: 8, color: p.color || '#7bed9f', size: 1.5
      });
    }

    // Hit knight
    if (knight.invincible <= 0) {
      const d = Math.hypot(p.x - knight.x, p.y - knight.y);
      if (d < 18) {
        knight.hp -= Math.floor(p.damage * (1 - (knight.dmgReduce || 0)));
        knight.invincible = 20;
        screenShake = 4;
        playSound('hurt');
        addFloatingText(`-${p.damage}`, knight.x, knight.y - 30, '#e94560');
        for (let j = 0; j < 3; j++) {
          const a = Math.random() * Math.PI * 2;
          particles.push({
            x: knight.x, y: knight.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2,
            life: 10, color: '#e94560', size: 2
          });
        }
        enemyProjectiles.splice(i, 1);
        if (knight.hp <= 0) {
          gameOver = true;
          screenShake = 15;
          showGameOver();
        }
        continue;
      }
    }
  }

  // Buff timers
  for (const key of ['speed', 'strength', 'range']) {
    if (knight.buffs[key] > 0) {
      knight.buffs[key]--;
      if (knight.buffs[key] <= 0) {
        if (key === 'speed') knight.speed = knight.baseSpeed;
        addFloatingText(`${POWERUP_TYPES[key].name}效果结束`, knight.x, knight.y - 50, '#aaa', 40);
      }
    }
  }

  // Active skill cooldowns
  for (const as of activeSkills) {
    if (as.cooldown > 0) as.cooldown--;
  }

  // Shadow clones
  for (let i = shadowClones.length - 1; i >= 0; i--) {
    const clone = shadowClones[i];
    clone.timer--;
    clone.attackTimer--;
    if (clone.timer <= 0) { shadowClones.splice(i, 1); continue; }
    let nearest = null, minDist = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x - clone.x, e.y - clone.y);
      if (d < minDist) { minDist = d; nearest = e; }
    }
    if (nearest && minDist > 30) {
      clone.x += ((nearest.x - clone.x) / minDist) * 3;
      clone.y += ((nearest.y - clone.y) / minDist) * 3;
      if (Math.abs(nearest.x - clone.x) > Math.abs(nearest.y - clone.y)) clone.dir = nearest.x > clone.x ? 0 : 2;
      else clone.dir = nearest.y > clone.y ? 1 : 3;
    }
    if (nearest && minDist < 60 && clone.attackTimer <= 0) {
      let dmg = Math.floor(20 * (knight.atkMult || 1));
      nearest.hp -= dmg; nearest.hitFlash = 8;
      addFloatingText(`-${dmg}`, nearest.x, nearest.y - 10, '#636e72');
      clone.attackTimer = 30;
      for (let j = 0; j < 3; j++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({ x: nearest.x, y: nearest.y, vx: Math.cos(a)*2, vy: Math.sin(a)*2, life: 12, color: '#636e72', size: 2 });
      }
    }
  }

  // Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.animTimer++;
    if (p.spawnAnim > 0) p.spawnAnim--;
    p.life--;

    // Despawn
    if (p.life <= 0) {
      powerups.splice(i, 1);
      continue;
    }

    // Pickup - check distance to knight
    const d = Math.hypot(p.x - knight.x, p.y - knight.y);
    if (d < 30) {
      applyPowerup(p.type);
      addFloatingText(POWERUP_TYPES[p.type].name + '!', p.x, p.y - 20, POWERUP_TYPES[p.type].color, 40);
      powerups.splice(i, 1);
      continue;
    }

    // Magnet effect - pull toward knight when close
    if (d < 100) {
      const pull = 0.03;
      p.x += (knight.x - p.x) * pull;
      p.y += (knight.y - p.y) * pull;
    }

    // Sparkle particles periodically
    if (p.animTimer % 15 === 0) {
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: p.x + Math.cos(a) * 8, y: p.y + Math.sin(a) * 8,
        vx: Math.cos(a) * 0.5, vy: Math.sin(a) * 0.5 - 0.5,
        life: 15, color: POWERUP_TYPES[p.type].glow, size: 2
      });
    }
  }

  // Formation phase transition
  if (formationPhase === 'forming' && currentFormation) {
    formationTimer++;
    const nonBoss = enemies.filter(e => !e.type.startsWith('boss'));
    const allReady = nonBoss.length > 0 && nonBoss.every(e => e.formationReady);
    if (allReady || formationTimer > 300) {
      formationPhase = 'holding';
      for (const e of nonBoss) e.formationReady = true;
      addFloatingText('阵法成型!', W() / 2, H() / 2 - 40, '#ffeaa7', 40);
    }
  }
  if (formationPhase === 'holding') {
    if (!formationHoldTimer) formationHoldTimer = 70;
    formationHoldTimer--;
    if (formationHoldTimer <= 0) {
      formationPhase = 'attacking';
      addFloatingText('阵法突进!', W() / 2, H() / 2 - 40, '#e94560', 40);
      for (const e of enemies) {
        if (!e.type.startsWith('boss')) e.attackMode = true;
      }
    }
  }

  // Next wave
  if (enemies.length === 0 && wave > 0 && !passivePaused && !upgradePaused && !bossKillPending && !skipPassiveThisWave) {
    if (!passiveScreenTriggered) {
      passiveScreenTriggered = true;
      setTimeout(() => showPassiveSkillScreen(), 300);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);

  // Slashes
  for (let i = slashes.length - 1; i >= 0; i--) {
    slashes[i].life--;
    if (slashes[i].life <= 0) slashes.splice(i, 1);
  }
  if (slashes.length > 80) slashes.splice(0, slashes.length - 80);

  // Floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 1;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }
  if (floatingTexts.length > 60) floatingTexts.splice(0, floatingTexts.length - 60);

  // Blood stains fade
  for (let i = bloodStains.length - 1; i >= 0; i--) {
    bloodStains[i].life--;
    if (bloodStains[i].life < 120) bloodStains[i].alpha *= 0.995;
    if (bloodStains[i].life <= 0) bloodStains.splice(i, 1);
  }
  // Cap blood stains
  if (bloodStains.length > 80) bloodStains.splice(0, bloodStains.length - 80);

  if (screenShake > 0) screenShake--;
  if (mobileMode) updateSkillBtnDisplay();
}

// Drawing
function drawKnight(x, y, dir, frame, attacking, attackTimer, invincible, weapon) {
  ctx.save();
  ctx.translate(x, y);
  const flicker = invincible > 0 && Math.floor(invincible / 3) % 2;
  if (flicker) ctx.globalAlpha = 0.4;

  // Shield aura when invincible (cached gradient)
  if (invincible > 10) {
    const auraAlpha = 0.2 + Math.sin(tick * 0.1) * 0.1;
    ctx.globalAlpha = auraAlpha;
    ctx.fillStyle = getGlowGrad('shield', 36, 'rgba(85,100,255,0.5)', 'rgba(85,100,255,0)');
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = Math.min(1, auraAlpha + 0.3);
    ctx.strokeStyle = '#70a1ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 28 + Math.sin(tick * 0.08) * 3, 0, Math.PI * 2);
    ctx.stroke();
    // Rotating hex ward
    ctx.globalAlpha = 0.25 + Math.sin(tick * 0.13) * 0.12;
    ctx.strokeStyle = '#a8c6ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i + tick * 0.025;
      if (i) ctx.lineTo(Math.cos(a) * 32, Math.sin(a) * 32);
      else ctx.moveTo(Math.cos(a) * 32, Math.sin(a) * 32);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = flicker ? 0.4 : 1;
  }

  // Strength glow when powered up (cached gradient)
  if (knight && knight.buffs && knight.buffs.strength > 0) {
    ctx.globalAlpha = 0.5 + Math.sin(tick * 0.12) * 0.2;
    ctx.fillStyle = getGlowGrad('strength', 26, 'rgba(255,99,72,0.4)', 'rgba(255,99,72,0)');
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = flicker ? 0.4 : 1;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 15, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body bounce
  const bounce = attacking ? 0 : Math.sin(frame * Math.PI / 2) * 2;

  // Cape (behind body, sways and flares on attack)
  const capeX = dir === 0 ? -7 : dir === 2 ? 7 : 0;
  const flare = attacking ? 4 : 0;
  const sway = Math.sin(tick * 0.12) * (attacking ? 3.5 : 2);
  ctx.fillStyle = '#8e2b20';
  ctx.beginPath();
  ctx.moveTo(capeX - 8, -9 + bounce);
  ctx.quadraticCurveTo(capeX - 10 - flare * 0.5 + sway, 5 + bounce, capeX - 8 - flare + sway * 2, 17 + bounce);
  ctx.lineTo(capeX + 8 + flare + sway * 2, 17 + bounce);
  ctx.quadraticCurveTo(capeX + 10 + flare * 0.5 - sway, 5 + bounce, capeX + 8, -9 + bounce);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,120,90,0.18)';
  ctx.fillRect(capeX - 6 + sway, -5 + bounce, 3, 18);

  // Legs (run cycle) + boots
  const lift = (dir === 1 || dir === 3 || attacking) ? 0 : Math.sin(frame * Math.PI / 2) * 2;
  ctx.fillStyle = '#4a3728';
  if (dir === 1 || dir === 3) {
    ctx.fillRect(-8, 8 + bounce, 6, 11);
    ctx.fillRect(2, 8 + bounce, 6, 11);
  } else {
    ctx.fillRect(-7, 8 + bounce - lift, 5, 12);
    ctx.fillRect(2, 8 + bounce + lift, 5, 12);
  }
  ctx.fillStyle = '#2f2318';
  if (dir === 1 || dir === 3) {
    ctx.fillRect(-8, 16 + bounce, 6, 4);
    ctx.fillRect(2, 16 + bounce, 6, 4);
  } else {
    ctx.fillRect(-7, 17 + bounce - lift, 5, 3.5);
    ctx.fillRect(2, 17 + bounce + lift, 5, 3.5);
  }

  // Torso armor (gradient plate + outline)
  ctx.fillStyle = getLinGrad('armor', 0, -12, 0, 12, '#a4b0b2', '#66757a');
  rrPath(-12, -10 + bounce, 24, 20, 5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Plate shine
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(-8, -8 + bounce, 4, 14);
  // Chest emblem
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath();
  ctx.moveTo(0, -4 + bounce); ctx.lineTo(3, -1 + bounce); ctx.lineTo(0, 2 + bounce); ctx.lineTo(-3, -1 + bounce);
  ctx.closePath();
  ctx.fill();
  // Shoulder pauldrons
  ctx.fillStyle = '#8b989a';
  ctx.beginPath(); ctx.arc(-12, -7 + bounce, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(12, -7 + bounce, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c8d3d5';
  ctx.beginPath(); ctx.arc(-13, -9 + bounce, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(11, -9 + bounce, 2, 0, Math.PI * 2); ctx.fill();
  // Belt + buckle
  ctx.fillStyle = '#4a3728';
  ctx.fillRect(-12, 5 + bounce, 24, 3.5);
  ctx.fillStyle = '#f39c12';
  ctx.fillRect(-3, 4.2 + bounce, 6, 5);

  // Head
  ctx.fillStyle = '#f5cba7';
  rrPath(-8, -22 + bounce, 16, 14, 4);
  ctx.fill();

  // Helmet dome (gradient) + rim
  ctx.fillStyle = getLinGrad('helm', 0, -32, 0, -20, '#a4b0b2', '#7f8c8d');
  ctx.beginPath();
  ctx.arc(0, -22 + bounce, 10, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-10, -22 + bounce, 20, 3);
  // Nose guard
  ctx.fillStyle = '#7f8c8d';
  ctx.fillRect(-1.5, -22 + bounce, 3, 9);
  // Visor slit
  ctx.fillStyle = '#1f2b38';
  ctx.fillRect(-8, -18 + bounce, 16, 3.5);
  // Eyes (glow red while attacking)
  if (attacking) {
    ctx.fillStyle = 'rgba(255,90,90,0.95)';
    ctx.fillRect(-6, -17.4 + bounce, 3.4, 2.4);
    ctx.fillRect(2.6, -17.4 + bounce, 3.4, 2.4);
  } else {
    ctx.fillStyle = '#cfd8dc';
    if (dir === 0) ctx.fillRect(3.5, -17.3 + bounce, 2.8, 2.2);
    else if (dir === 2) ctx.fillRect(-6.3, -17.3 + bounce, 2.8, 2.2);
    else { ctx.fillRect(-4.5, -17.3 + bounce, 2.8, 2.2); ctx.fillRect(1.7, -17.3 + bounce, 2.8, 2.2); }
  }
  // Helmet plume (sways)
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -32 + bounce);
  ctx.quadraticCurveTo(2 + Math.sin(tick * 0.1) * 2, -39 + bounce, 7 + Math.sin(tick * 0.1) * 3, -36 + bounce);
  ctx.stroke();

  // Weapon drawing
  if (weapon === 'sword') {
    // === SWORD ===
    if (attacking) {
      const swingAngle = (1 - attackTimer / 12) * Math.PI * 0.8 - Math.PI * 0.4;
      ctx.save();
      const swordBaseX = dir === 0 ? 12 : dir === 2 ? -12 : 0;
      const swordBaseY = -5 + bounce;
      ctx.translate(swordBaseX, swordBaseY);
      const baseAngle = [0, Math.PI/2, Math.PI, -Math.PI/2][dir];
      ctx.rotate(baseAngle + swingAngle);
      // Tapered blade with gradient
      ctx.fillStyle = getLinGrad('blade', 0, -30, 0, 0, '#ffffff', '#aeb9be');
      ctx.beginPath();
      ctx.moveTo(-2.6, 0);
      ctx.lineTo(-1.2, -27);
      ctx.lineTo(0, -31);
      ctx.lineTo(1.2, -27);
      ctx.lineTo(2.6, 0);
      ctx.closePath();
      ctx.fill();
      // Fuller
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(-0.7, -26, 1.4, 23);
      // Crossguard + grip + pommel
      ctx.fillStyle = '#f39c12';
      rrPath(-7, -3, 14, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(-2, 1, 4, 8);
      ctx.fillStyle = '#f39c12';
      ctx.beginPath(); ctx.arc(0, 10, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      const sx = dir === 0 ? 14 : dir === 2 ? -14 : 0;
      const sy = -2 + bounce;
      ctx.translate(sx, sy);
      ctx.rotate([0.3, Math.PI/2 + 0.3, Math.PI - 0.3, -Math.PI/2 - 0.3][dir]);
      ctx.fillStyle = getLinGrad('blade2', 0, -22, 0, 0, '#ffffff', '#aeb9be');
      ctx.beginPath();
      ctx.moveTo(-2, 0);
      ctx.lineTo(-0.9, -19);
      ctx.lineTo(0, -22);
      ctx.lineTo(0.9, -19);
      ctx.lineTo(2, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f39c12';
      ctx.fillRect(-4, -2, 8, 3);
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(-1.5, 1, 3, 6);
      // Twinkling glint near tip
      const gA = Math.max(0, Math.sin(tick * 0.05));
      if (gA > 0.7) {
        ctx.globalAlpha = (gA - 0.7) * 3;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-3, -18); ctx.lineTo(3, -18);
        ctx.moveTo(0, -21); ctx.lineTo(0, -15);
        ctx.stroke();
        ctx.globalAlpha = flicker ? 0.4 : 1;
      }
      ctx.restore();
    }
  } else if (weapon === 'axe') {
    // === THROWING AXE ===
    if (attacking) {
      // Wind-up / throw animation
      const throwProgress = 1 - attackTimer / 8;
      ctx.save();
      const axBaseX = dir === 0 ? 10 : dir === 2 ? -10 : 0;
      const axBaseY = -8 + bounce;
      ctx.translate(axBaseX, axBaseY);
      const baseAngle = [0, Math.PI/2, Math.PI, -Math.PI/2][dir];
      ctx.rotate(baseAngle - 0.5 + throwProgress * 1.5);
      // Handle
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(-2, -6, 4, 16);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0.8, -6, 1.2, 16);
      // Axe head (steel gradient)
      ctx.fillStyle = getLinGrad('axeSteel', 0, -24, 0, -14, '#e8eef0', '#8fa0a6');
      ctx.fillRect(-2.5, -16, 5, 10);
      ctx.fillStyle = '#e17055';
      ctx.beginPath();
      ctx.moveTo(-7, -16);
      ctx.lineTo(0, -24);
      ctx.lineTo(7, -16);
      ctx.lineTo(3, -14);
      ctx.lineTo(0, -19);
      ctx.lineTo(-3, -14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#dfe6e9';
      ctx.beginPath();
      ctx.moveTo(-5, -16);
      ctx.lineTo(0, -22);
      ctx.lineTo(5, -16);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      // Idle axe held at side
      ctx.save();
      const sx = dir === 0 ? 14 : dir === 2 ? -14 : 0;
      const sy = -2 + bounce;
      ctx.translate(sx, sy);
      ctx.rotate([0.4, Math.PI/2 + 0.4, Math.PI - 0.4, -Math.PI/2 - 0.4][dir]);
      // Handle
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(-1.5, -6, 3, 14);
      // Axe head
      ctx.fillStyle = getLinGrad('axeSteel2', 0, -21, 0, -13, '#dfe6e9', '#8fa0a6');
      ctx.fillRect(-2, -14, 4, 8);
      ctx.fillStyle = '#e17055';
      ctx.beginPath();
      ctx.moveTo(-6, -14);
      ctx.lineTo(0, -21);
      ctx.lineTo(6, -14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  } else {
    // === WAR HAMMER ===
    if (attacking) {
      // Slam animation - overhead to ground
      const slamProgress = 1 - attackTimer / 18;
      ctx.save();
      const hBaseX = dir === 0 ? 8 : dir === 2 ? -8 : 0;
      const hBaseY = -5 + bounce;
      ctx.translate(hBaseX, hBaseY);
      const baseAngle = [0, Math.PI/2, Math.PI, -Math.PI/2][dir];
      ctx.rotate(baseAngle - 1.2 + slamProgress * 2.5);
      // Handle
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(-2.5, -4, 5, 24);
      // Hammer head
      ctx.fillStyle = '#636e72';
      ctx.fillRect(-10, -10, 20, 10);
      ctx.fillStyle = getLinGrad('hammerSteel', 0, -10, 0, -2, '#c3ced2', '#8a979c');
      ctx.fillRect(-8, -9, 16, 8);
      // Face
      ctx.fillStyle = '#dfe6e9';
      ctx.fillRect(-10, -10, 4, 10);
      // Spike
      ctx.fillStyle = '#636e72';
      ctx.beginPath();
      ctx.moveTo(10, -10);
      ctx.lineTo(14, -5);
      ctx.lineTo(10, 0);
      ctx.closePath();
      ctx.fill();
      // Impact charge glow at end of slam
      if (slamProgress > 0.65) {
        const cg = (slamProgress - 0.65) / 0.35;
        ctx.globalAlpha = cg * 0.5;
        ctx.fillStyle = '#fdcb6e';
        ctx.beginPath();
        ctx.arc(2, -5, 6 + cg * 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    } else {
      // Idle hammer held at side
      ctx.save();
      const sx = dir === 0 ? 14 : dir === 2 ? -14 : 0;
      const sy = -2 + bounce;
      ctx.translate(sx, sy);
      ctx.rotate([0.5, Math.PI/2 + 0.5, Math.PI - 0.5, -Math.PI/2 - 0.5][dir]);
      // Handle
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(-2, -4, 4, 18);
      // Hammer head
      ctx.fillStyle = '#636e72';
      ctx.fillRect(-8, -10, 16, 8);
      ctx.fillStyle = '#b2bec3';
      ctx.fillRect(-6, -9, 12, 6);
      ctx.restore();
    }
  }

  // Shield (left side)
  if (dir !== 0) {
    const shx = dir === 2 ? 11 : -11;
    ctx.fillStyle = getLinGrad('shieldBody', 0, -10, 0, 12, '#3498db', '#21618c');
    ctx.beginPath();
    ctx.moveTo(shx - 7, -9 + bounce);
    ctx.lineTo(shx + 7, -9 + bounce);
    ctx.lineTo(shx + 7, 2 + bounce);
    ctx.quadraticCurveTo(shx, 13 + bounce, shx - 7, 2 + bounce);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1b4f6b';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Inner panel
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(shx - 4.5, -6 + bounce, 9, 9);
    // Emblem + rivets
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(shx, 0 + bounce, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(shx - 5.5, -8 + bounce, 1.5, 1.5);
    ctx.fillRect(shx + 4, -8 + bounce, 1.5, 1.5);
  }

  ctx.restore();
}

function drawDog(x, y, frame, hitFlash, hp, maxHp, type, size) {
  const def = ENEMY_TYPES[type] || ENEMY_TYPES.normal;
  const s = size || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  const flick = hitFlash > 0;
  if (flick) { ctx.globalAlpha = 0.55 + Math.sin(hitFlash * 2.5) * 0.45; }
  const baseA = ctx.globalAlpha;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, 14, 14, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  const bounce = Math.sin(frame * Math.PI / 2) * 1.5;
  const legOffset = Math.sin(frame * Math.PI / 2) * 4;
  const isBoss = type && type.startsWith('boss');

  // Tail (behind body, wagging)
  ctx.strokeStyle = def.earColor;
  ctx.lineWidth = isBoss ? 5 : 3;
  ctx.lineCap = 'round';
  const tailWag = Math.sin(frame * 0.8) * (isBoss ? 12 : 8);
  ctx.beginPath();
  ctx.moveTo(0, 4 + bounce);
  ctx.quadraticCurveTo(12, -5 + bounce + tailWag, 16, -12 + bounce + tailWag);
  ctx.stroke();

  // Far legs
  ctx.fillStyle = def.earColor;
  ctx.fillRect(-10, 6 + bounce - legOffset * 0.5, 4, 9);
  ctx.fillRect(7, 6 + bounce + legOffset * 0.5, 4, 9);

  // Body
  ctx.fillStyle = flick ? '#ff6b6b' : def.color;
  ctx.beginPath();
  ctx.ellipse(0, -2 + bounce, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // Belly highlight
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath();
  ctx.ellipse(0, 2.5 + bounce, 9, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Dark stripe on back
  ctx.fillStyle = flick ? 'rgba(255,130,130,0.7)' : def.earColor;
  ctx.beginPath();
  ctx.ellipse(0, -6.5 + bounce, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Near legs (animated) + paws
  ctx.fillStyle = flick ? '#ff8f8f' : def.color;
  ctx.fillRect(-5, 6 + bounce + legOffset * 0.5, 4, 10);
  ctx.fillRect(2, 6 + bounce - legOffset * 0.5, 4, 10);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(-5, 14 + bounce + legOffset * 0.5, 4, 2.5);
  ctx.fillRect(2, 14 + bounce - legOffset * 0.5, 4, 2.5);

  // Head
  ctx.fillStyle = flick ? '#ff6b6b' : def.color;
  ctx.beginPath();
  ctx.ellipse(0, -16 + bounce, 9, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.stroke();

  // Ears (pointy, with inner shading)
  ctx.fillStyle = def.earColor;
  ctx.beginPath();
  ctx.moveTo(-7, -19 + bounce); ctx.lineTo(-14, -31 + bounce); ctx.lineTo(-3.5, -20.5 + bounce);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(7, -19 + bounce); ctx.lineTo(14, -31 + bounce); ctx.lineTo(3.5, -20.5 + bounce);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.moveTo(-6.5, -20 + bounce); ctx.lineTo(-11.5, -28 + bounce); ctx.lineTo(-4.5, -20.8 + bounce);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(6.5, -20 + bounce); ctx.lineTo(11.5, -28 + bounce); ctx.lineTo(4.5, -20.8 + bounce);
  ctx.closePath(); ctx.fill();

  // Angry brows
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-7, -21.5 + bounce); ctx.lineTo(-2, -19.5 + bounce);
  ctx.moveTo(7, -21.5 + bounce); ctx.lineTo(2, -19.5 + bounce);
  ctx.stroke();

  // Eyes (with glow)
  const eyeColor = isBoss ? '#ffff33' : '#e74c3c';
  ctx.globalAlpha = baseA * 0.35;
  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.ellipse(-4, -17 + bounce, 4.2, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -17 + bounce, 4.2, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = baseA;
  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.ellipse(-4, -17 + bounce, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -17 + bounce, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  // Evil pupils
  ctx.fillStyle = isBoss ? '#ff2020' : '#000';
  ctx.beginPath(); ctx.ellipse(-4, -17 + bounce, 1.2, 1.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -17 + bounce, 1.2, 1.5, 0, 0, Math.PI * 2); ctx.fill();
  // Glints
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(-5.2, -18.6 + bounce, 1.2, 1.2);
  ctx.fillRect(2.8, -18.6 + bounce, 1.2, 1.2);

  // Boss aura + crown
  if (isBoss) {
    const auraRGB = { boss: '231,76,60', bossFire: '236,112,85', bossShadow: '93,109,126', bossIce: '116,185,255', bossPoison: '108,92,231', bossThunder: '243,156,18' }[type] || '231,76,60';
    ctx.globalAlpha = baseA * (0.14 + Math.sin(tick * 0.08) * 0.07);
    ctx.fillStyle = `rgba(${auraRGB},1)`;
    ctx.beginPath();
    ctx.arc(0, -2 + bounce, 26 + Math.sin(tick * 0.1) * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = baseA * (0.28 + Math.sin(tick * 0.12) * 0.12);
    ctx.strokeStyle = `rgba(${auraRGB},1)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -2 + bounce, 30, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = baseA;

    // Crown
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.moveTo(-9, -27 + bounce);
    ctx.lineTo(-6.5, -34 + bounce);
    ctx.lineTo(-2.5, -29.5 + bounce);
    ctx.lineTo(0, -36 + bounce);
    ctx.lineTo(2.5, -29.5 + bounce);
    ctx.lineTo(6.5, -34 + bounce);
    ctx.lineTo(9, -27 + bounce);
    ctx.closePath();
    ctx.fill();
    // Crown band
    ctx.fillStyle = '#d4a017';
    ctx.fillRect(-9, -27.5 + bounce, 18, 2);
    // Gem color by boss type
    const gemColor = { boss: '#e74c3c', bossFire: '#e67e22', bossShadow: '#34495e', bossIce: '#74b9ff', bossPoison: '#6c5ce7', bossThunder: '#f39c12' }[type] || '#e74c3c';
    ctx.fillStyle = gemColor;
    ctx.beginPath();
    ctx.arc(0, -31 + bounce, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(-0.7, -31.7 + bounce, 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Fast type: speed lines aura
  if (type === 'fast') {
    ctx.strokeStyle = 'rgba(109,76,26,0.45)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-18 - i * 5, -5 + i * 6 + bounce);
      ctx.lineTo(-12 - i * 5, -5 + i * 6 + bounce);
      ctx.stroke();
    }
  }

  // Tank type: armor plates + rivets
  if (type === 'tank') {
    ctx.fillStyle = '#555';
    ctx.fillRect(-12, -8 + bounce, 24, 3.5);
    ctx.fillRect(-12, 2 + bounce, 24, 3.5);
    ctx.fillStyle = '#777';
    ctx.fillRect(-12, -8 + bounce, 24, 1);
    ctx.fillRect(-12, 2 + bounce, 24, 1);
    ctx.fillStyle = '#999';
    ctx.beginPath(); ctx.arc(-9, -6.5 + bounce, 1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -6.5 + bounce, 1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-9, 3.5 + bounce, 1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, 3.5 + bounce, 1, 0, Math.PI * 2); ctx.fill();
  }

  // Shooter type: green scope ring + aura
  if (type === 'shooter') {
    ctx.globalAlpha = baseA * (0.18 + Math.sin(tick * 0.3) * 0.08);
    ctx.fillStyle = '#2ed573';
    ctx.beginPath();
    ctx.arc(0, -2 + bounce, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = baseA;
    ctx.strokeStyle = '#2ed573';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, -17 + bounce, 5.5, 0, Math.PI * 2);
    ctx.stroke();
    // Crosshair ticks
    ctx.beginPath();
    ctx.moveTo(0, -24 + bounce); ctx.lineTo(0, -21.5 + bounce);
    ctx.moveTo(0, -12.5 + bounce); ctx.lineTo(0, -10 + bounce);
    ctx.stroke();
  }

  // Healer type: healing aura + cross
  if (type === 'healer') {
    ctx.globalAlpha = baseA * (0.16 + Math.sin(tick * 0.24) * 0.1);
    ctx.fillStyle = '#2ed573';
    ctx.beginPath();
    ctx.arc(0, -2 + bounce, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = baseA;
    // Cross symbol
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -27 + bounce, 4, 10);
    ctx.fillRect(-5, -24 + bounce, 10, 4);
  }

  // Bomber type: orange glow + sparking fuse
  if (type === 'bomber') {
    ctx.globalAlpha = baseA * (0.22 + Math.sin(tick * 0.4) * 0.12);
    ctx.fillStyle = '#e67e22';
    ctx.beginPath();
    ctx.arc(0, -2 + bounce, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = baseA;
    // Fuse on head
    ctx.strokeStyle = '#784212';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -23 + bounce);
    ctx.quadraticCurveTo(5, -31 + bounce, 2, -35 + bounce);
    ctx.stroke();
    // Fuse spark
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(2, -35 + bounce, 2 + Math.sin(tick * 0.9) * 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.arc(2, -35 + bounce, 1, 0, Math.PI * 2);
    ctx.fill();
  }

  // Assassin type: dark aura + dagger scars
  if (type === 'assassin') {
    ctx.globalAlpha = baseA * (0.16 + Math.sin(tick * 0.36) * 0.08);
    ctx.fillStyle = '#2d3436';
    ctx.beginPath();
    ctx.arc(0, -2 + bounce, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = baseA;
    // Dagger scars on cheeks
    ctx.strokeStyle = '#8d9ea5';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8, -14 + bounce); ctx.lineTo(-12, -10 + bounce);
    ctx.moveTo(8, -14 + bounce); ctx.lineTo(12, -10 + bounce);
    ctx.stroke();
  }

  // Snout
  ctx.fillStyle = isBoss ? '#4a0000' : '#3d2208';
  ctx.beginPath();
  ctx.ellipse(0, -11.5 + bounce, 5.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Nose
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(0, -14 + bounce, 2.5, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, -11 + bounce, 3.2, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();

  // Teeth + fangs
  ctx.fillStyle = '#fff';
  ctx.fillRect(-4, -9.5 + bounce, 2, 3);
  ctx.fillRect(2, -9.5 + bounce, 2, 3);
  ctx.fillRect(-3.2, -9.5 + bounce, 1.5, 4.5);
  ctx.fillRect(1.7, -9.5 + bounce, 1.5, 4.5);

  // Name tag
  ctx.fillStyle = isBoss ? 'rgba(255,60,60,0.95)' : 'rgba(233,69,96,0.85)';
  ctx.font = `bold ${isBoss ? 14 : 10}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.fillText(def.name, 0, (isBoss ? -50 : -35) + bounce);

  // HP bar (always for boss, only when damaged otherwise)
  if (isBoss || hp < maxHp) {
    const barW = isBoss ? 60 : 26;
    const barH = isBoss ? 5 : 3;
    const by = (isBoss ? -45 : -30) + bounce;
    const ratio = Math.max(0, hp / maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(-barW / 2 - 1, by - 1, barW + 2, barH + 2);
    ctx.fillStyle = ratio > 0.5 ? '#2ed573' : ratio > 0.25 ? '#ffa502' : '#e94560';
    ctx.fillRect(-barW / 2, by, barW * ratio, barH);
  }

  ctx.restore();
}

function draw() {
  // Background (pre-rendered once per resize)
  if (!bgCanvas || bgDirty || bgCanvas.width !== canvas.width || bgCanvas.height !== canvas.height) buildBackground();
  ctx.drawImage(bgCanvas, 0, 0);

  // Ambient drifting embers
  for (const em of ambientEmbers) {
    em.y -= em.v / H();
    em.x += Math.sin(tick * 0.01 + em.ph) * 0.0004;
    if (em.y < -0.02) { em.y = 1.02; em.x = Math.random(); }
    const tw = 0.5 + Math.sin(tick * 0.05 + em.ph) * 0.5;
    ctx.globalAlpha = 0.05 + tw * 0.11;
    ctx.fillStyle = em.hue ? '#ff9f6a' : '#9db8ff';
    ctx.beginPath();
    ctx.arc(em.x * W(), em.y * H(), em.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Trigram aura tint for the current wave
  drawHexAura();

  ctx.save();
  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake * 2,
      (Math.random() - 0.5) * screenShake * 2
    );
  }

  // Blood stains (ground layer, stable rotation)
  for (const bs of bloodStains) {
    ctx.globalAlpha = bs.alpha;
    ctx.fillStyle = '#5a1a1a';
    ctx.beginPath();
    ctx.ellipse(bs.x, bs.y, bs.size, bs.size * 0.6, bs.rot, 0, Math.PI * 2);
    ctx.fill();
    if (bs.blobs) {
      for (const bl of bs.blobs) {
        ctx.beginPath();
        ctx.ellipse(bs.x + bl.ox, bs.y + bl.oy, bl.r, bl.r * 0.62, bl.rot, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  // Formation lines
  if (currentFormation && formationPhase !== 'attacking') {
    const nonBoss = enemies.filter(e => !e.type.startsWith('boss') && e.formationPos);
    if (nonBoss.length > 1) {
      ctx.strokeStyle = 'rgba(255,234,167,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < nonBoss.length - 1; i++) {
        ctx.moveTo(nonBoss[i].x, nonBoss[i].y);
        ctx.lineTo(nonBoss[i+1].x, nonBoss[i+1].y);
      }
      ctx.stroke();
      // Formation position markers
      if (formationPhase === 'forming') {
        ctx.fillStyle = 'rgba(255,234,167,0.1)';
        for (const e of nonBoss) {
          ctx.beginPath();
          ctx.arc(e.formationPos.x, e.formationPos.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // Obstacles
  for (const ob of obstacles) {
    const halfW = ob.w / 2, halfH = ob.h / 2;
    ob.pulse += 0.03;
    const pulse = Math.sin(ob.pulse) * 0.15 + 0.85;
    // Ground glow for hazard zones (fire / water)
    if (ob.dmg > 0 || ob.slow > 0) {
      ctx.globalAlpha = 0.12 * pulse;
      ctx.fillStyle = ob.dmg > 0 ? '#e17055' : '#0984e3';
      ctx.beginPath();
      ctx.arc(ob.x, ob.y, Math.max(ob.w, ob.h) * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.9 * pulse;
    ctx.fillStyle = ob.color;
    rrPath(ob.x - halfW, ob.y - halfH, ob.w, ob.h, 6);
    ctx.fill();
    ctx.strokeStyle = ob.borderColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 16px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ob.trigram, ob.x, ob.y);
    drawStoneFx(ob);
    // Hazard ring
    if (ob.dmg > 0 || ob.slow > 0) {
      ctx.strokeStyle = ob.dmg > 0
        ? `rgba(225,112,85,${0.3 + Math.sin(ob.pulse * 2) * 0.2})`
        : `rgba(9,132,227,${0.3 + Math.sin(ob.pulse * 2) * 0.2})`;
      ctx.lineWidth = 1.5;
      rrPath(ob.x - halfW - 4, ob.y - halfH - 4, ob.w + 8, ob.h + 8, 8);
      ctx.stroke();
    }
    ctx.textBaseline = 'alphabetic';
  }

  // Enemies
  for (const e of enemies) {
    drawDog(e.x, e.y, e.animFrame, e.hitFlash, e.hp, e.maxHp, e.type || 'normal', e.size || 1);
    // Time slow visual
    if (e.slowTimer > 0) {
      ctx.fillStyle = 'rgba(116,185,255,0.15)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, (e.size || 1) * 20, 0, Math.PI * 2);
      ctx.fill();
    }
    // Enrage ring
    if (e.enraged) {
      ctx.strokeStyle = `rgba(255,40,40,${0.35 + Math.sin(tick * 0.3) * 0.2})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, (e.size || 1) * 22 + Math.sin(tick * 0.2) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Powerups
  for (const p of powerups) {
    drawPowerup(p.x, p.y, p.type, p.animTimer, p.spawnAnim);
  }

  // Projectiles (axes) with motion trail
  for (const p of projectiles) {
    // Trail streak
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#e17055';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    // Glow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#e17055';
    ctx.beginPath();
    ctx.arc(0, -8, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // Handle
    ctx.fillStyle = '#4a3728';
    ctx.fillRect(-2, -2, 4, 18);
    // Axe head
    ctx.fillStyle = getLinGrad('axeFly', 0, -24, 0, -12, '#e8eef0', '#8fa0a6');
    ctx.fillRect(-3, -14, 6, 12);
    ctx.fillStyle = '#e17055';
    ctx.beginPath();
    ctx.moveTo(-8, -14);
    ctx.lineTo(0, -24);
    ctx.lineTo(8, -14);
    ctx.lineTo(4, -12);
    ctx.lineTo(0, -18);
    ctx.lineTo(-4, -12);
    ctx.closePath();
    ctx.fill();
    // Axe edge
    ctx.fillStyle = '#dfe6e9';
    ctx.beginPath();
    ctx.moveTo(-6, -14);
    ctx.lineTo(0, -22);
    ctx.lineTo(6, -14);
    ctx.lineTo(3, -13);
    ctx.lineTo(0, -19);
    ctx.lineTo(-3, -13);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Enemy projectiles (elemental styles)
  for (const p of enemyProjectiles) {
    const pColor = p.color || '#2ed573';
    const pSize = p.size || 6;
    ctx.save();
    ctx.translate(p.x, p.y);
    // Outer glow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = pColor;
    ctx.beginPath();
    ctx.arc(0, 0, pSize * 1.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (p.color === '#74b9ff') {
      // Ice crystal
      ctx.fillStyle = '#dff3ff';
      ctx.beginPath();
      ctx.moveTo(0, -pSize); ctx.lineTo(pSize * 0.6, 0);
      ctx.lineTo(0, pSize); ctx.lineTo(-pSize * 0.6, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = pColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (p.color === '#e74c3c') {
      // Fireball: layered flicker core
      ctx.fillStyle = '#ff9f43';
      ctx.beginPath();
      ctx.arc(0, 0, pSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = pColor;
      ctx.beginPath();
      ctx.arc(0, 0, pSize * 0.65, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffeaa7';
      ctx.beginPath();
      ctx.arc(0, 0, pSize * 0.3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Plasma ball
      ctx.fillStyle = pColor;
      ctx.beginPath();
      ctx.arc(0, 0, pSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-pSize * 0.25, -pSize * 0.25, pSize * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Slashes & shockwaves (drawn over enemies)
  for (const s of slashes) {
    ctx.save();
    ctx.translate(s.x, s.y);
    const alpha = s.life / s.maxLife;
    const sz = s.size || 1;

    if (s.isHammer) {
      // Hammer shockwave: double ring + ground cracks
      const t = 1 - alpha;
      const radius = t * sz * 50 + 20;
      ctx.strokeStyle = `rgba(253,203,110,${alpha})`;
      ctx.lineWidth = 5 * alpha + 1;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(225,112,85,${alpha * 0.55})`;
      ctx.lineWidth = 9 * alpha + 1;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.82, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(250,220,150,${alpha * 0.8})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (Math.PI * 2 / 8) * k + 0.35;
        ctx.moveTo(Math.cos(a) * radius * 0.5, Math.sin(a) * radius * 0.5);
        ctx.lineTo(Math.cos(a + 0.18) * radius * 0.95, Math.sin(a + 0.18) * radius * 0.95);
      }
      ctx.stroke();
    } else if (s.isLightning) {
      // Jagged lightning bolt (glow pass + white core)
      const ex = (s.tx !== undefined ? s.tx : s.x) - s.x;
      const ey = (s.ty !== undefined ? s.ty : s.y) - s.y;
      const len = Math.hypot(ex, ey) || 1;
      const nx = -ey / len, ny = ex / len;
      ctx.lineCap = 'round';
      for (let pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass ? `rgba(255,255,255,${alpha})` : `rgba(116,185,255,${alpha * 0.5})`;
        ctx.lineWidth = pass ? 2 : 6;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        for (let i = 1; i <= 5; i++) {
          const f = i / 5;
          const off = i === 5 ? 0 : (Math.random() - 0.5) * 16;
          ctx.lineTo(ex * f + nx * off, ey * f + ny * off);
        }
        ctx.stroke();
      }
    } else if (s.isMeteor) {
      // Meteor: descending burning rock + fire trail + impact ring
      const rockY = -alpha * 150;
      for (let i = 1; i <= 5; i++) {
        ctx.globalAlpha = alpha * Math.max(0.5 - i * 0.08, 0.05);
        ctx.fillStyle = i < 3 ? '#ffeaa7' : i < 5 ? '#e67e22' : '#e74c3c';
        ctx.beginPath();
        ctx.arc(Math.sin(i * 1.7) * 3, rockY - i * 16, Math.max((7 - i) * 1.6, 1), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#5d4037';
      ctx.beginPath();
      ctx.arc(0, rockY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.arc(2.5, rockY - 3, 4.5, 0, Math.PI * 2);
      ctx.fill();
      if (alpha < 0.35) {
        const ir = ((0.35 - alpha) / 0.35) * 80 + 10;
        ctx.strokeStyle = `rgba(253,203,110,${alpha / 0.35})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, ir, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (s.isPillar) {
      // Trigram of Heaven: descending light pillar
      const t = 1 - alpha;
      const w0 = 16 * (1 - t * 0.4);
      const h0 = H() * 0.6;
      ctx.fillStyle = `rgba(255,234,167,${alpha * 0.18})`;
      ctx.fillRect(s.x - w0 / 2, s.y - h0, w0, h0);
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.35})`;
      ctx.fillRect(s.x - w0 * 0.22, s.y - h0, w0 * 0.44, h0);
      ctx.fillStyle = `rgba(255,234,167,${alpha * 0.5})`;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, w0 * 0.9, w0 * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.isRipple) {
      // Trigram of Lake / Water / Earth: expanding ground ripple
      const t = 1 - alpha;
      const maxR = 90 * (s.size || 1);
      const rCol = s.rc || '#00cec9';
      ctx.strokeStyle = hexToRgba(rCol, alpha * 0.7);
      ctx.lineWidth = 2 * alpha + 0.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, maxR * t + 6, (maxR * t + 6) * 0.35, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.4})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, (maxR * t + 6) * 0.6, (maxR * t + 6) * 0.21, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (s.isGust) {
      // Trigram of Wind: sweeping gust streaks
      const t = 1 - alpha;
      const dir = s.dir || 1;
      const len = 110 * (s.size || 1);
      const off = (t * 90 + 20) * dir;
      ctx.strokeStyle = `rgba(168,216,255,${alpha * 0.8})`;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (let k = 0; k < 2; k++) {
        const y0 = (k - 0.5) * 8;
        ctx.beginPath();
        ctx.moveTo(-len + off, y0);
        ctx.quadraticCurveTo(off, y0 - 6 * dir, len * 0.7 + off, y0 + 2);
        ctx.stroke();
      }
    } else if (s.isRing) {
      // Expanding death/impact ring
      const r = (1 - alpha) * 34 * sz + 4;
      ctx.strokeStyle = (sz > 1.5 ? 'rgba(255,221,87,' : 'rgba(255,255,255,') + (alpha * 0.9) + ')';
      ctx.lineWidth = 2.5 * alpha + 0.5;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      // Sword arc: layered tapered strokes
      ctx.rotate(s.angle);
      const R = (38 + (1 - alpha) * 24) * sz;
      ctx.lineCap = 'round';
      ctx.strokeStyle = knight && knight.buffs.range > 0 ? `rgba(165,94,234,${alpha * 0.35})` : `rgba(255,107,129,${alpha * 0.35})`;
      ctx.lineWidth = 10 * sz * alpha + 1;
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.94, -0.65, 0.65);
      ctx.stroke();
      ctx.strokeStyle = knight && knight.buffs.range > 0 ? `rgba(165,94,234,${alpha * 0.75})` : `rgba(233,69,96,${alpha * 0.75})`;
      ctx.lineWidth = 5 * sz * alpha + 0.5;
      ctx.beginPath();
      ctx.arc(0, 0, R, -0.5, 0.5);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 2 * sz * alpha + 0.5;
      ctx.beginPath();
      ctx.arc(0, 0, R, -0.42, 0.42);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Particles: motion streaks for fast, halos for large
  for (const p of particles) {
    const alpha = Math.min(p.life / 30, 1);
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 2.2 && p.size >= 2) {
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = Math.max(p.size * alpha, 0.6);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      if (p.size * alpha > 2.2) {
        ctx.globalAlpha = alpha * 0.25;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(p.size * alpha, 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Knight
  if (knight) {
    drawKnight(knight.x, knight.y, knight.dir, knight.animFrame,
      knight.attacking, knight.attackTimer, knight.invincible, knight.weapon);
  }

  // Shadow clones
  for (const clone of shadowClones) {
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.01) * 0.15;
    drawKnight(clone.x, clone.y, clone.dir, clone.frame, false, 0, 0, 'sword');
    ctx.globalAlpha = 1;
    ctx.restore();
    if (Math.random() < 0.2) {
      particles.push({
        x: clone.x + (Math.random()-0.5)*10, y: clone.y + (Math.random()-0.5)*10,
        vx: 0, vy: -0.5, life: 15, color: '#636e72', size: 2
      });
    }
  }

  // Floating texts
  for (const ft of floatingTexts) {
    const alpha = ft.life / ft.maxLife;
    ctx.globalAlpha = Math.min(alpha, 1);
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${ft.maxLife > 50 ? 24 : 16}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // HUD
  if (knight && gameRunning) {
    // HP bar
    const hpX = 20, hpY = 20, hpW = 220, hpH = 18;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(hpX - 2, hpY - 2, hpW + 4, hpH + 4);
    ctx.fillStyle = '#333';
    ctx.fillRect(hpX, hpY, hpW, hpH);
    const hpRatio = Math.max(0, knight.hp / knight.maxHp);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ed573' : hpRatio > 0.25 ? '#ffa502' : '#e94560';
    ctx.fillRect(hpX, hpY, hpW * hpRatio, hpH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.textAlign = 'left';
    ctx.fillText(`HP ${Math.max(0, knight.hp)}/${knight.maxHp}`, hpX + 5, hpY + 14);

    // Weapon indicator (hidden in mobile mode, buttons handle this)
    if (!mobileMode) {
      const wDef = WEAPONS[knight.weapon];
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(W() / 2 - 100, H() - 40, 200, 30);
      ctx.fillStyle = wDef.color;
      ctx.font = 'bold 14px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText(`${wDef.icon} ${wDef.name} [Q切换/123选择]`, W() / 2, H() - 20);
    } else {
      // Show current weapon name at top center for mobile
      const wDef = WEAPONS[knight.weapon];
      ctx.font = 'bold 16px Microsoft YaHei';
      ctx.textAlign = 'center';
      const tw2 = ctx.measureText(`${wDef.icon} ${wDef.name}`).width;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(W() / 2 - tw2 / 2 - 10, 8, tw2 + 20, 26);
      ctx.fillStyle = wDef.color;
      ctx.fillText(`${wDef.icon} ${wDef.name}`, W() / 2, 27);
    }

    // Score
    ctx.fillStyle = '#ffdd57';
    ctx.font = 'bold 18px Microsoft YaHei';
    ctx.textAlign = 'right';
    ctx.fillText(`得分: ${score}`, W() - 20, 35);

    // Wave
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 14px Microsoft YaHei';
    ctx.fillText(`第 ${wave} 波 | 剩余: ${enemies.length}`, W() - 20, 55);

    // Sound toggle hint
    ctx.fillStyle = soundEnabled ? '#2ed573' : '#888';
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.fillText(soundEnabled ? '🔊 M键静音' : '🔇 M键开启', W() - 20, 91);

    // Upgrade count & stat summary
    if (totalUpgrades > 0) {
      ctx.fillStyle = '#a55eea';
      ctx.font = 'bold 12px Microsoft YaHei';
      ctx.fillText(`强化: ${totalUpgrades}`, W() - 20, 73);
      // Stat bonuses on left side below HP
      let statY = 48;
      ctx.font = '11px Microsoft YaHei';
      ctx.textAlign = 'left';
      if ((knight.atkMult || 1) > 1) { ctx.fillStyle = '#ff6348'; ctx.fillText(`攻击+${Math.round((knight.atkMult-1)*100)}%`, 20, statY); statY += 14; }
      if ((knight.rangeMult || 1) > 1) { ctx.fillStyle = '#a55eea'; ctx.fillText(`范围+${Math.round((knight.rangeMult-1)*100)}%`, 20, statY); statY += 14; }
      if (knight.critChance > 0) { ctx.fillStyle = '#ffeaa7'; ctx.fillText(`暴击${Math.round(knight.critChance*100)}%`, 20, statY); statY += 14; }
      if (knight.lifesteal > 0) { ctx.fillStyle = '#d63031'; ctx.fillText(`吸血${Math.round(knight.lifesteal*100)}%`, 20, statY); statY += 14; }
      if ((knight.dmgReduce || 0) > 0) { ctx.fillStyle = '#74b9ff'; ctx.fillText(`减伤${Math.round(knight.dmgReduce*100)}%`, 20, statY); statY += 14; }
      if (knight.regenRate > 2) { ctx.fillStyle = '#fd79a8'; ctx.fillText(`回复${knight.regenRate}/s`, 20, statY); statY += 14; }
    }

    // Passive count
    if (totalPassives > 0) {
      ctx.fillStyle = '#2ed573';
      ctx.font = 'bold 12px Microsoft YaHei';
      ctx.textAlign = 'right';
      ctx.fillText(`被动: ${totalPassives}`, W() - 20, 91);
    }

    // Hexagram display (top-left, below stats)
    if (currentHexagram) {
      const hx = 20;
      let hy = 48;
      if (totalUpgrades > 0) { hy += 14; const k = knight; if ((k.atkMult||1)>1) hy+=14; if ((k.rangeMult||1)>1) hy+=14; if (k.critChance>0) hy+=14; if (k.lifesteal>0) hy+=14; if ((k.dmgReduce||0)>0) hy+=14; if (k.regenRate>2) hy+=14; }
      const hColor = currentHexagram.type === 'buff' ? '#2ed573' : currentHexagram.type === 'debuff' ? '#e94560' : '#ffeaa7';
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(hx - 4, hy - 4, 170, 32);
      ctx.strokeStyle = hColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(hx - 4, hy - 4, 170, 32);
      ctx.fillStyle = hColor;
      ctx.font = 'bold 13px Microsoft YaHei';
      ctx.textAlign = 'left';
      ctx.fillText(`${currentHexagram.symbol} ${currentHexagram.name}`, hx + 2, hy + 10);
      ctx.font = '10px Microsoft YaHei';
      ctx.fillStyle = '#ccc';
      ctx.fillText(currentHexagram.desc, hx + 2, hy + 23);
    }

    // Active skills HUD
    if (activeSkills.length > 0) {
      const skillSize = 44;
      const skillGap = 8;
      const totalW = activeSkills.length * (skillSize + skillGap) - skillGap;
      let sx = W() / 2 - totalW / 2;
      const sy = H() - 55;
      for (const as of activeSkills) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(sx, sy, skillSize, skillSize);
        ctx.strokeStyle = as.cooldown <= 0 ? as.def.color : '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, sy, skillSize, skillSize);
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = as.cooldown > 0 ? '#666' : '#fff';
        ctx.fillText(as.def.icon, sx + skillSize/2, sy + 28);
        if (as.cooldown > 0) {
          const cdRatio = as.cooldown / as.def.cooldown;
          ctx.fillStyle = 'rgba(0,0,0,0.65)';
          ctx.fillRect(sx, sy + skillSize * (1 - cdRatio), skillSize, skillSize * cdRatio);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px Microsoft YaHei';
          ctx.fillText(`${Math.ceil(as.cooldown / 60)}`, sx + skillSize/2, sy + skillSize/2 + 4);
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '10px Microsoft YaHei';
        ctx.fillText('R', sx + skillSize/2, sy - 3);
        sx += skillSize + skillGap;
      }
    }

    // Combo
    if (comboCount > 1 && comboTimer > 0) {
      const cAlpha = Math.min(comboTimer / 20, 1);
      ctx.globalAlpha = cAlpha;
      ctx.fillStyle = '#ffdd57';
      ctx.font = 'bold 22px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText(`${comboCount} 连击!`, W() / 2, 60);
      ctx.globalAlpha = 1;
    }

    // Active buffs display
    const activeBuffs = [];
    if (knight.buffs.speed > 0) activeBuffs.push({ name: '速度', color: '#2ed573', timer: knight.buffs.speed, icon: '⚡' });
    if (knight.buffs.strength > 0) activeBuffs.push({ name: '力量', color: '#ff6348', timer: knight.buffs.strength, icon: '⚔' });
    if (knight.buffs.range > 0) activeBuffs.push({ name: '范围', color: '#a55eea', timer: knight.buffs.range, icon: '◎' });
    if (knight.invincible > 10) activeBuffs.push({ name: '无敌', color: '#3742fa', timer: knight.invincible, icon: '🛡' });

    if (activeBuffs.length > 0) {
      const buffX = 20;
      let buffY = 50;
      ctx.font = '12px Microsoft YaHei';
      ctx.textAlign = 'left';
      for (const b of activeBuffs) {
        const sec = Math.ceil(b.timer / 60);
        const ratio = b.timer / (b.name === '无敌' ? 300 : 480);
        // Background
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(buffX, buffY, 120, 18);
        // Progress bar
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.6;
        ctx.fillRect(buffX, buffY, 120 * Math.min(ratio, 1), 18);
        ctx.globalAlpha = 1;
        // Text
        ctx.fillStyle = '#fff';
        ctx.fillText(`${b.icon} ${b.name} ${sec}s`, buffX + 5, buffY + 14);
        buffY += 22;
      }
    }

    // Edge warning indicators for off-screen enemies
    const edgePad = 30;
    for (const e of enemies) {
      if (e.x > -10 && e.x < W() + 10 && e.y > -10 && e.y < H() + 10) continue;
      const dx = e.x - knight.x;
      const dy = e.y - knight.y;
      const a = Math.atan2(dy, dx);
      // Clamp to screen edge
      let ix = knight.x + Math.cos(a) * (W() / 2 - edgePad);
      let iy = knight.y + Math.sin(a) * (H() / 2 - edgePad);
      ix = Math.max(edgePad, Math.min(W() - edgePad, ix));
      iy = Math.max(edgePad, Math.min(H() - edgePad, iy));
      // Draw arrow
      ctx.save();
      ctx.translate(ix, iy);
      ctx.rotate(a);
      const arrowColor = (e.type && e.type.startsWith('boss')) ? '#ff0000' : '#e94560';
      ctx.fillStyle = arrowColor;
      ctx.globalAlpha = 0.7 + Math.sin(Date.now() * 0.005) * 0.3;
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-5, -6);
      ctx.lineTo(-5, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // Low HP vignette (cached gradient)
  if (knight && knight.hp < knight.maxHp * 0.3 && knight.hp > 0) {
    const vignetteAlpha = (1 - knight.hp / (knight.maxHp * 0.3)) * 0.4;
    if (!vignetteGrad || vignetteGradW !== W() || vignetteGradH !== H()) {
      vignetteGrad = ctx.createRadialGradient(W() / 2, H() / 2, W() * 0.2, W() / 2, H() / 2, W() * 0.7);
      vignetteGrad.addColorStop(0, 'rgba(200,0,0,0)');
      vignetteGrad.addColorStop(1, 'rgba(200,0,0,1)');
      vignetteGradW = W();
      vignetteGradH = H();
    }
    ctx.globalAlpha = vignetteAlpha;
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W(), H());
    // Heartbeat pulse
    const pulse = Math.sin(Date.now() * 0.006) * 0.5 + 0.5;
    ctx.globalAlpha = pulse * vignetteAlpha * 0.3;
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(0, 0, W(), H());
    ctx.globalAlpha = 1;
  }
}

function loop() {
  tick++;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
