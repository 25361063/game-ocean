<style>

body { background: #1a1a2e; overflow: hidden; justify-content: flex-start; align-items: flex-start; height: 100vh; height: 100dvh; font-family: 'Microsoft YaHei', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

#btn-weapon:active { background: rgba(253,203,110,0.9); }

#btn-weapon2 { position: absolute; bottom: 250px; right: 74px; width: 56px; height: 56px; border-radius: 50%; background: rgba(225,112,85,0.35); border: 2px solid rgba(225,112,85,0.7); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
#btn-weapon3 { position: absolute; bottom: 316px; right: 38px; width: 56px; height: 56px; border-radius: 50%; background: rgba(253,203,110,0.35); border: 2px solid rgba(253,203,110,0.7); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
#btn-weapon1:active, #btn-weapon2:active, #btn-weapon3:active { transform: scale(0.9); }

#dlg-chapter { color: #ffeaa7; font-size: 13px; font-weight: bold; text-shadow: 0 0 10px rgba(255,234,167,0.6); margin-bottom: 6px; letter-spacing: 2px; }
#dlg-box { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 780px; background: rgba(10,12,28,0.93); border: 2px solid rgba(233,69,96,0.7); border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 26px rgba(0,0,0,0.65); }
#dlg-face { font-size: 28px; width: 52px; height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); border: 2px solid #fff; border-radius: 12px; }

@keyframes dlgPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

<body>

  <div id="btn-skill" style="position:absolute;bottom:30px;left:200px;width:75px;height:75px;border-radius:50%;background:rgba(233,69,96,0.45);border:2px solid rgba(233,69,96,0.8);color:#fff;font-size:15px;display:none;align-items:center;justify-content:center;pointer-events:auto;-webkit-tap-highlight-color:transparent;">R技</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

let mobileMode = true;
let selectedMode = 'mobile';
let joystickActive = false;
let joystickTouchId = null;
let joystickDX = 0;
let joystickDY = 0;
let joystickCenterX = 0;
let joystickCenterY = 0;
const JOYSTICK_RADIUS = 75;

// === Render caches (built once, reused every frame) ===
let bgCanvas = null;
let bgDirty = true;
let tick = 0;
let vignetteGrad = null, vignetteGradW = 0, vignetteGradH = 0;
const glowGrads = {};
const linGrads = {};
const ambientEmbers = [];

function getGlowGrad(key, r, inner, outer) {
  let g = glowGrads[key];
  if (!g) {
    g = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
    g.addColorStop(0, inner);
    g.addColorStop(1, outer);
    glowGrads[key] = g;
  }
  return g;
}
function getLinGrad(key, x0, y0, x1, y1, c0, c1) {
  let g = linGrads[key];
  if (!g) {
    g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, c0);
    g.addColorStop(1, c1);
    linGrads[key] = g;
  }
  return g;
}
function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.max(canvas.width, 1);
  bgCanvas.height = Math.max(canvas.height, 1);
  const b = bgCanvas.getContext('2d');
  const w = bgCanvas.width, h = bgCanvas.height;
  const grad = b.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#131a36');
  grad.addColorStop(0.55, '#16213e');
  grad.addColorStop(1, '#0f3460');
  b.fillStyle = grad;
  b.fillRect(0, 0, w, h);
  // Checker tiles
  b.fillStyle = 'rgba(255,255,255,0.022)';
  for (let x = 0; x < w; x += 40) {
    for (let y = 0; y < h; y += 40) {
      if (((x / 40) + (y / 40)) % 2 === 0) b.fillRect(x, y, 40, 40);
    }
  }
  // Faint grid
  b.strokeStyle = 'rgba(255,255,255,0.028)';
  b.lineWidth = 1;
  b.beginPath();
  for (let x = 0; x <= w; x += 80) { b.moveTo(x + 0.5, 0); b.lineTo(x + 0.5, h); }
  for (let y = 0; y <= h; y += 80) { b.moveTo(0, y + 0.5); b.lineTo(w, y + 0.5); }
  b.stroke();
  // Stars
  for (let i = 0; i < Math.floor(w * h / 22000); i++) {
    const sx = Math.random() * w, sy = Math.random() * h * 0.7;
    b.globalAlpha = 0.15 + Math.random() * 0.3;
    b.fillStyle = Math.random() < 0.25 ? '#ffd9a0' : '#cfe4ff';
    b.beginPath();
    b.arc(sx, sy, Math.random() * 1.2 + 0.3, 0, Math.PI * 2);
    b.fill();
  }
  b.globalAlpha = 1;
  // Corner vignette
  const vg = b.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.32)');
  b.fillStyle = vg;
  b.fillRect(0, 0, w, h);
  bgDirty = false;
}
function initAmbient() {
  for (let i = 0; i < 24; i++) {
    ambientEmbers.push({
      x: Math.random(), y: Math.random(),
      s: 0.6 + Math.random() * 1.6,
      v: 0.15 + Math.random() * 0.4,
      ph: Math.random() * Math.PI * 2,
      hue: Math.random() < 0.5
    });
  }
}
initAmbient();

// Mobile-only mode - no desktop/mobile selection needed
document.getElementById('btn-start').addEventListener('click', () => startGame());
document.getElementById('btn-start').addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, { passive: false });

function isMobileLandscape() {
  return window.innerWidth > window.innerHeight;
}

function checkOrientation() {
  const hint = document.getElementById('rotate-hint');
  if (mobileMode && !isMobileLandscape()) {
    hint.style.display = 'flex';
  } else {
    hint.style.display = 'none';
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  bgDirty = true;
  checkOrientation();
}
resize();
window.addEventListener('resize', () => { resize(); if (mobileMode) checkOrientation(); });
window.addEventListener('orientationchange', () => { setTimeout(() => { resize(); if (mobileMode) checkOrientation(); }, 200); });

// === Mobile Joystick ===
function initMobileControls() {
  const joystickArea = document.getElementById('joystick-area');
  const knob = document.getElementById('joystick-knob');

  function updateJoystickCenter() {
    const rect = joystickArea.getBoundingClientRect();
    joystickCenterX = rect.left + rect.width / 2;
    joystickCenterY = rect.top + rect.height / 2;
  }

  joystickArea.addEventListener('touchstart', (e) => {
    e.preventDefault();
    e.stopPropagation();
    for (const touch of e.changedTouches) {
      if (joystickTouchId === null) {
        joystickTouchId = touch.identifier;
        joystickActive = true;
        updateJoystickCenter();
        handleJoystickMove(touch, knob);
      }
    }
  }, { passive: false });

  joystickArea.addEventListener('touchmove', (e) => {
    e.preventDefault();
    e.stopPropagation();
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        handleJoystickMove(touch, knob);
      }
    }
  }, { passive: false });

  const joystickEnd = (e) => {
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        joystickTouchId = null;
        joystickActive = false;
        joystickDX = 0;
        joystickDY = 0;
        knob.style.left = '48px';
        knob.style.top = '48px';
      }
    }
  };
  joystickArea.addEventListener('touchend', joystickEnd);
  joystickArea.addEventListener('touchcancel', joystickEnd);

  // Attack button
  const btnAttack = document.getElementById('btn-attack');
  btnAttack.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (gameRunning) knightAttack(); }, { passive: false });

  // Weapon switch button
  const btnWeapon = document.getElementById('btn-weapon');
  btnWeapon.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (gameRunning) { switchWeapon(); updateWeaponBtnDisplay(); } }, { passive: false });

  // Direct weapon select buttons
  const btnW1 = document.getElementById('btn-weapon1');
  const btnW2 = document.getElementById('btn-weapon2');
  const btnW3 = document.getElementById('btn-weapon3');
  btnW1.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (gameRunning && knight) { knight.weapon = 'sword'; addFloatingText('切换: ⚔ 圣剑', knight.x, knight.y - 50, '#dfe6e9', 35); updateWeaponBtnDisplay(); } }, { passive: false });
  btnW2.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (gameRunning && knight) { knight.weapon = 'axe'; addFloatingText('切换: 🪓 飞斧', knight.x, knight.y - 50, '#e17055', 35); updateWeaponBtnDisplay(); } }, { passive: false });
  btnW3.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (gameRunning && knight) { knight.weapon = 'hammer'; addFloatingText('切换: 🔨 战锤', knight.x, knight.y - 50, '#fdcb6e', 35); updateWeaponBtnDisplay(); } }, { passive: false });

  // Active skill button
  const btnSkill = document.getElementById('btn-skill');
  btnSkill.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); if (gameRunning) activateActiveSkill(); }, { passive: false });
}

function updateWeaponBtnDisplay() {
  if (!knight) return;
  const btnWeapon = document.getElementById('btn-weapon');
  const wDef = WEAPONS[knight.weapon];
  btnWeapon.textContent = wDef.icon;
  // Highlight active weapon button
  document.getElementById('btn-weapon1').style.borderColor = knight.weapon === 'sword' ? 'rgba(223,230,233,1)' : 'rgba(223,230,233,0.7)';
  document.getElementById('btn-weapon1').style.background = knight.weapon === 'sword' ? 'rgba(223,230,233,0.7)' : 'rgba(223,230,233,0.4)';
  document.getElementById('btn-weapon2').style.borderColor = knight.weapon === 'axe' ? 'rgba(225,112,85,1)' : 'rgba(225,112,85,0.7)';
  document.getElementById('btn-weapon2').style.background = knight.weapon === 'axe' ? 'rgba(225,112,85,0.7)' : 'rgba(225,112,85,0.4)';
  document.getElementById('btn-weapon3').style.borderColor = knight.weapon === 'hammer' ? 'rgba(253,203,110,1)' : 'rgba(253,203,110,0.7)';
  document.getElementById('btn-weapon3').style.background = knight.weapon === 'hammer' ? 'rgba(253,203,110,0.7)' : 'rgba(253,203,110,0.4)';
  updateSkillBtnDisplay();
}

function updateSkillBtnDisplay() {
  const btn = document.getElementById('btn-skill');
  if (!btn) return;
  if (activeSkills.length === 0) { btn.style.display = 'none'; return; }
  btn.style.display = 'flex';
  const ready = activeSkills.some(a => a.cooldown <= 0);
  btn.style.background = ready ? 'rgba(233,69,96,0.7)' : 'rgba(100,100,100,0.4)';
  btn.style.borderColor = ready ? 'rgba(233,69,96,1)' : 'rgba(100,100,100,0.6)';
}

function handleJoystickMove(touch, knob) {
  let dx = touch.clientX - joystickCenterX;
  let dy = touch.clientY - joystickCenterY;
  const dist = Math.hypot(dx, dy);
  if (dist > JOYSTICK_RADIUS) {
    dx = (dx / dist) * JOYSTICK_RADIUS;
    dy = (dy / dist) * JOYSTICK_RADIUS;
  }
  joystickDX = dx / JOYSTICK_RADIUS;
  joystickDY = dy / JOYSTICK_RADIUS;
  knob.style.left = (48 + dx) + 'px';
  knob.style.top = (48 + dy) + 'px';
}

const W = () => canvas.width;
const H = () => canvas.height;

// Game state
let knight, enemies, particles, slashes, gameRunning, score, wave, gameOver;
let keys = {};
let bossQueue = [];
let upgradePaused = false;
let upgradeChoices = [];
let totalUpgrades = 0;
let passivePaused = false;
let passiveChoices = [];
let totalPassives = 0;
let activeSkills = [];
let shadowClones = [];
let bossKillPending = false;
let passiveScreenTriggered = false;
let pendingSurrenderText = '';
let pendingSurrenderBoss = '';
let currentHexagram = null;
let hexagramEnemyMods = {};
let nextHexagram = null;
let skipPassiveThisWave = false;
let obstacles = [];
let currentFormation = null;
let formationPositions = [];
let formationPhase = 'forming';
let formationHoldTimer = 0;
let formationTimer = 0;
let bossKillCount = 0;

// === Sound System ===
let audioCtx = null;
let soundEnabled = true;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const gain = audioCtx.createGain();
  gain.connect(audioCtx.destination);
  const osc = audioCtx.createOscillator();
  switch (type) {
    case 'swing':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now); osc.frequency.linearRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.connect(gain); osc.start(now); osc.stop(now + 0.1); break;
    case 'hit':
      osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(100, now + 0.08);
      gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
      osc.connect(gain); osc.start(now); osc.stop(now + 0.08); break;
    case 'kill':
      osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now); osc.frequency.linearRampToValueAtTime(200, now + 0.15);
      gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
      osc.connect(gain); osc.start(now); osc.stop(now + 0.15); break;
    case 'hurt':

function playStory(lines, onDone) {
  if (!lines || lines.length === 0) { if (onDone) onDone(); return; }
  dlgQueue = lines;
  dlgIdx = 0;
  dlgOnDone = onDone || null;
  dialoguePaused = true;
  document.getElementById('dialogue').style.display = 'flex';
  showDlgLine();
}

function showDlgLine() {
  const line = dlgQueue[dlgIdx] || {};
  const full = String(line.text == null ? '' : line.text);
  const nameEl = document.getElementById('dlg-name');
  const textEl = document.getElementById('dlg-text');
  const faceEl = document.getElementById('dlg-face');
  const chapEl = document.getElementById('dlg-chapter');
  nameEl.textContent = line.who || '';
  nameEl.style.color = line.color || '#fff';
  faceEl.textContent = line.face || '❓';
  faceEl.style.borderColor = line.color || '#fff';
  if (line.chapter) { chapEl.textContent = line.chapter; chapEl.style.display = 'block'; }
  else chapEl.style.display = 'none';
  clearInterval(dlgTimer);
  textEl.textContent = '';
  textEl.dataset.full = full;
  document.getElementById('dlg-hint').style.visibility = 'hidden';
  let i = 0;
  dlgTimer = setInterval(() => {
    i++;
    textEl.textContent = full.slice(0, i);
    if (i >= full.length) {
      clearInterval(dlgTimer);
      document.getElementById('dlg-hint').style.visibility = 'visible';
    }
  }, 26);
}

function advanceDialogue() {
  const textEl = document.getElementById('dlg-text');
  const full = textEl.dataset.full || '';
  if (textEl.textContent.length < full.length) {
    clearInterval(dlgTimer);
    textEl.textContent = full;
    document.getElementById('dlg-hint').style.visibility = 'visible';
    return;
  }
  dlgIdx++;
  if (dlgIdx >= dlgQueue.length) endDialogue();
  else showDlgLine();
}

function endDialogue() {
  clearInterval(dlgTimer);
  document.getElementById('dialogue').style.display = 'none';
  dialoguePaused = false;
  const cb = dlgOnDone;
  dlgOnDone = null;
  dlgQueue = [];
  if (cb) cb();
}

function forceCloseDialogue() {
  clearInterval(dlgTimer);
  document.getElementById('dialogue').style.display = 'none';
  dialoguePaused = false;
  dlgOnDone = null;
  dlgQueue = [];
}

// Dialogue tap / skip handlers
(function initDialogue() {
  const dlg = document.getElementById('dialogue');
  const advance = (e) => { e.preventDefault(); e.stopPropagation(); advanceDialogue(); };
  dlg.addEventListener('click', advance);
  dlg.addEventListener('touchstart', advance, { passive: false });
  const skipBtn = document.getElementById('dlg-skip');
  const skip = (e) => { e.preventDefault(); e.stopPropagation(); endDialogue(); };
  skipBtn.addEventListener('click', skip);
  skipBtn.addEventListener('touchstart', skip, { passive: false });
})();

    '兑','中孚','睽','归妹','大过','困','咸','萃',
    '大有','噬嗑','离','丰','鼎','未济','旅','晋',
    '大壮','明夷','震','豫','恒','解','小过','豫',
    '小畜','中孚','家人','益','巽','涣','渐','观',
    '需','节','既济','屯','井','坎','蹇','比',
    '大畜','损','贲','颐','蛊','蒙','艮','剥',
    '泰','临','明夷','复','升','师','谦','坤'
  ];
  const buffs = [
    { stat: 'atkMult', val: 0.2, desc: '攻击力 +20%', dStat: 'attack' },

    { stat: 'critChance', val: 0.15, desc: '暴击率 +15%', dStat: 'critical' },
    { stat: 'regenRate', val: 5, desc: '每秒回血 +5', dStat: 'regeneration' },
    { stat: 'dmgReduce', val: 0.2, desc: '受伤减免 +20%', dStat: 'armor' },
    { stat: 'rangeMult', val: 0.2, desc: '攻击范围 +20%', dStat: 'range' },
    { stat: 'lifesteal', val: 0.1, desc: '吸血 +10%', dStat: 'lifesteal' }
  ];
  const debuffs = [

    { stat: 'critChance', val: -0.99, desc: '暴击率归零', dStat: 'critical' },
    { stat: 'regenRate', val: -2, desc: '每秒掉血 2', dStat: 'regeneration' },
    { stat: 'dmgReduce', val: -0.15, desc: '受伤增加 15%', dStat: 'armor' },
    { stat: 'rangeMult', val: -0.15, desc: '攻击范围 -15%', dStat: 'range' },
    { stat: 'lifesteal', val: -0.99, desc: '吸血归零', dStat: 'lifesteal' }
  ];
  const mixed = [
    { stat: 'atkMult', val: 0.3, stat2: 'hexSpdMult', val2: -0.2, desc: '攻+30% 速-20%', dStat: 'attack' },
    { stat: 'hexSpdMult', val: 0.4, stat2: 'atkMult', val2: -0.25, desc: '速+40% 攻-25%', dStat: 'speed' },
    { stat: 'critChance', val: 0.25, stat2: 'atkMult', val2: -0.1, desc: '暴击+25% 攻-10%', dStat: 'critical' },
    { stat: 'regenRate', val: 8, stat2: 'atkMult', val2: -0.2, desc: '回血+8 攻-20%', dStat: 'regeneration' },
    { stat: 'rangeMult', val: 0.3, stat2: 'hexSpdMult', val2: -0.15, desc: '范围+30% 速-15%', dStat: 'range' },
    { stat: 'atkMult', val: 0.5, desc: '攻+50% 每秒掉血3', dStat: 'attack', dot: 3 },
    { stat: 'hexSpdMult', val: 0.5, stat2: 'dmgReduce', val2: -0.3, desc: '速+50% 受伤+30%', dStat: 'speed' },
    { stat: 'dmgReduce', val: 0.3, stat2: 'hexSpdMult', val2: -0.25, desc: '减伤+30% 速-25%', dStat: 'armor' },
    { stat: 'lifesteal', val: 0.15, stat2: 'regenRate', val2: -3, desc: '吸血+15% 回血-3', dStat: 'lifesteal' },
    { stat: 'atkMult', val: 0.4, stat2: 'dmgReduce', val2: -0.2, desc: '攻+40% 减伤-20%', dStat: 'attack' }
  ];
  const eHpBuff = { desc: '敌HP+30%', dStat: 'enemy_hp', eMods: { hpMult: 1.3 } };
  const eSpdBuff = { desc: '敌速+25%', dStat: 'enemy_speed', eMods: { spdMult: 1.25 } };
  const eDmgBuff = { desc: '敌攻+30%', dStat: 'enemy_damage', eMods: { dmgMult: 1.3 } };
  const eAllBuff = { desc: '敌全属性+20%', dStat: 'enemy_all', eMods: { hpMult: 1.2, spdMult: 1.2, dmgMult: 1.2 } };
  const result = [];
  for (let i = 0; i < 64; i++) {
    const upper = Math.floor(i / 8);
    const lower = i % 8;
    const sym = upperTrigrams[upper].sym + lowerTrigrams[lower].sym;
    const name = hexNames[i] + '为' + upperTrigrams[upper].name;
    let effect;
    if (i < 20) { effect = buffs[i % 7]; }
    else if (i < 40) { effect = debuffs[(i - 20) % 7]; }
    else { effect = mixed[(i - 40) % 10]; }
    const isEnemy = i === 15 || i === 31 || i === 47 || i === 63;
    const isDOT = effect.dot > 0;
    const isDebuff = i >= 20 && i < 40;
    result.push({
      id: i + 1, name, symbol: sym,
      desc: isEnemy ? [eHpBuff, eSpdBuff, eDmgBuff, eAllBuff][i % 4].desc : effect.desc,
      type: isDebuff ? 'debuff' : (i >= 40 ? 'mixed' : 'buff'),
      apply: (k) => {
        if (isEnemy) {
          const m = [eHpBuff, eSpdBuff, eDmgBuff, eAllBuff][i % 4].eMods;
          hexagramEnemyMods = { ...m };
        } else {
          if (!k._hexMods) k._hexMods = [];
          if (effect.stat === 'hexSpdMult') {
            k._hexMods.push({ stat: 'hexSpdMult', orig: k.hexSpdMult || 1 });
            k.hexSpdMult = (k.hexSpdMult || 1) + effect.val;
          } else {
            k._hexMods.push({ stat: effect.stat, orig: k[effect.stat] });
            k[effect.stat] = (k[effect.stat] || (effect.stat === 'atkMult' || effect.stat === 'rangeMult' ? 1 : 0)) + effect.val;
          }
          if (effect.stat2) {
            if (effect.stat2 === 'hexSpdMult') {
              k._hexMods.push({ stat: 'hexSpdMult', orig: k.hexSpdMult || 1 });
              k.hexSpdMult = (k.hexSpdMult || 1) + effect.val2;
            } else {
              k._hexMods.push({ stat: effect.stat2, orig: k[effect.stat2] });
              k[effect.stat2] = (k[effect.stat2] || (effect.stat2 === 'atkMult' || effect.stat2 === 'rangeMult' ? 1 : 0)) + effect.val2;
            }
          }
          if (isDOT) {
            k._hexDOT = effect.dot;
          }
        }
      },
      clear: (k) => {
        if (isEnemy) {
          hexagramEnemyMods = {};
        } else {
          if (k._hexMods) {
            for (const m of k._hexMods) { k[m.stat] = m.orig; }
            k._hexMods = null;
          }
          k._hexDOT = 0;
        }
      }
    });
  }
  return result;
})();

function spawnObstacles(hex) {
  obstacles = [];
  const upperIdx = Math.floor((hex.id - 1) / 8);
  const te = TRIGRAM_EFFECTS[upperIdx];
  const margin = 80;
  for (let i = 0; i < te.count; i++) {
    let x, y, tries = 0;
    do {
      x = margin + Math.random() * (W() - margin * 2);
      y = margin + Math.random() * (H() - margin * 2);
      tries++;
    } while (tries < 20 && Math.hypot(x - W() / 2, y - H() / 2) < 80);
    obstacles.push({
      x, y, w: te.size + Math.random() * 15, h: te.size + Math.random() * 15,
      color: te.color, borderColor: te.borderColor,
      dmg: te.dmg, slow: te.slow, trigram: te.name,
      pulse: Math.random() * Math.PI * 2
    });
  }
}

// === Trigram FX (卦象专属特效) ===
let hexFx = null;          // TRIGRAM_EFFECTS entry of the current wave's upper trigram
let hexAmbientTimer = 0;
const hexAuraCache = {};

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function setHexFx(hex) {
  hexFx = TRIGRAM_EFFECTS[Math.floor((hex.id - 1) / 8)];
}

// Persistent ambience during the wave (a few particles per second)
function updateHexAmbient() {
  if (!hexFx || !currentHexagram) return;
  hexAmbientTimer++;
  if (hexAmbientTimer % hexFx.fx.rate !== 0) return;
  const fromLeft = Math.random() < 0.5;
  switch (hexFx.fx.kind) {
    case 'sky': particles.push({ x: Math.random() * W(), y: -5, vx: (Math.random() - 0.5) * 0.3, vy: 0.8 + Math.random() * 0.8, life: 80, color: '#ffeaa7', size: 1 + Math.random() }); break;
    case 'lake': particles.push({ x: Math.random() * W(), y: H() + 4, vx: (Math.random() - 0.5) * 0.3, vy: -(0.7 + Math.random() * 0.7), life: 90, color: '#00cec9', size: 1.2 + Math.random() }); break;
    case 'fire': particles.push({ x: Math.random() * W(), y: H() + 4, vx: (Math.random() - 0.5) * 0.4, vy: -(1 + Math.random()), life: 70, color: Math.random() < 0.5 ? '#e67e22' : '#e74c3c', size: 1.2 + Math.random() * 1.4 }); break;
    case 'thunder': particles.push({ x: Math.random() * W(), y: Math.random() * H(), vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, life: 10, color: '#f9ca24', size: 1.5 }); break;
    case 'wind': particles.push({ x: fromLeft ? -5 : W() + 5, y: Math.random() * H(), vx: (fromLeft ? 1 : -1) * (1.5 + Math.random() * 1.5), vy: (Math.random() - 0.5) * 0.5, life: 90, color: '#a8d8ff', size: 1 + Math.random() * 1.2 }); break;
    case 'water': particles.push({ x: Math.random() * W(), y: -5, vx: 0, vy: 2 + Math.random(), life: 70, color: '#74b9ff', size: 1.2 }); break;
    case 'mountain': particles.push({ x: Math.random() * W(), y: H() + 4, vx: (Math.random() - 0.5) * 0.5, vy: -(0.4 + Math.random() * 0.6), life: 80, color: '#95a5a6', size: 1.5 + Math.random() }); break;
    case 'earth': particles.push({ x: Math.random() * W(), y: H() + 4, vx: (Math.random() - 0.5) * 0.8, vy: -(0.5 + Math.random() * 0.7), life: 80, color: '#b2bec3', size: 1.2 + Math.random() }); break;

// Full-screen trigram aura (edge tint in the trigram color)
function drawHexAura() {
  if (!hexFx || !currentHexagram) return;
  const key = hexFx.fx.fxColor + '|' + W() + 'x' + H();
  let g = hexAuraCache[key];
  if (!g) {
    g = ctx.createRadialGradient(W() / 2, H() / 2, Math.min(W(), H()) * 0.3, W() / 2, H() / 2, Math.max(W(), H()) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, hexToRgba(hexFx.fx.fxColor, 0.55));
    hexAuraCache[key] = g;
  }
  ctx.globalAlpha = 0.16 + Math.sin(tick * 0.03) * 0.05;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W(), H());
  ctx.globalAlpha = 1;
}

// Per-stone trigram decoration
function drawStoneFx(ob) {
  switch (ob.trigram) {
    case '天': {
      // Halo + rotating rays
      const r = Math.max(ob.w, ob.h) * 0.9;
      ctx.strokeStyle = `rgba(255,234,167,${0.35 + Math.sin(ob.pulse * 2) * 0.15})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ob.x, ob.y, r, 0, Math.PI * 2);
      ctx.stroke();
      for (let k = 0; k < 4; k++) {
        const a = ob.pulse * 0.5 + (Math.PI / 2) * k;
        ctx.beginPath();
        ctx.moveTo(ob.x + Math.cos(a) * (r + 3), ob.y + Math.sin(a) * (r + 3));
        ctx.lineTo(ob.x + Math.cos(a) * (r + 9), ob.y + Math.sin(a) * (r + 9));
        ctx.stroke();
      }
      break;
    }
    case '泽': {
      // Ripple pool at base + rising bubbles
      ctx.strokeStyle = 'rgba(0,206,201,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(ob.x, ob.y + ob.h * 0.55, ob.w * 0.7, ob.h * 0.28, 0, 0, Math.PI * 2);
      ctx.stroke();
      for (let k = 0; k < 3; k++) {
        const ph = (tick * 0.02 + k * 0.33 + ob.pulse) % 1;
        ctx.globalAlpha = 0.5 * (1 - ph);
        ctx.beginPath();
        ctx.arc(ob.x + Math.sin(k * 2.1 + ob.pulse) * 6, ob.y - ob.h * 0.5 - ph * 26, 2 + k, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      break;
    }
    case '火': {
      // Flickering flames on the top edge
      for (let k = -1; k <= 1; k++) {
        const fl = Math.sin(tick * 0.35 + k * 1.7 + ob.pulse * 3) * 2;
        const fx0 = ob.x + k * (ob.w * 0.28);
        ctx.fillStyle = k === 0 ? 'rgba(255,220,120,0.9)' : 'rgba(230,126,34,0.8)';
        ctx.beginPath();
        ctx.moveTo(fx0 - 3.5, ob.y - ob.h * 0.5 + 1);
        ctx.quadraticCurveTo(fx0 + fl * 0.4, ob.y - ob.h * 0.5 - 9 - fl, fx0 + 3.5, ob.y - ob.h * 0.5 + 1);
        ctx.closePath();
        ctx.fill();
      }
      break;
    }
    case '雷': {
      // Flashing jagged spark across the stone
      const flash = Math.max(0, Math.sin(tick * 0.25 + ob.pulse * 5));
      if (flash > 0.55) {
        ctx.strokeStyle = `rgba(253,203,110,${flash})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        let sx = ob.x - ob.w * 0.4;
        let sy = ob.y - ob.h * 0.5 - 4;
        ctx.moveTo(sx, sy);
        for (let k = 0; k < 4; k++) {
          sx += ob.w * 0.25;
          sy += (k % 2 ? -1 : 1) * 4;
          ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }
      break;
    }
    case '风': {
      // Rotating swirl arcs
      ctx.strokeStyle = 'rgba(116,185,255,0.55)';
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 2; k++) {
        const a0 = tick * 0.06 + k * Math.PI;
        ctx.beginPath();
        ctx.arc(ob.x, ob.y, Math.max(ob.w, ob.h) * 0.75 + k * 4, a0, a0 + 1.1);
        ctx.stroke();
      }
      break;
    }
    case '水': {
      // Puddle ring + dripping droplet
      ctx.strokeStyle = 'rgba(9,132,227,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(ob.x, ob.y + ob.h * 0.55, ob.w * 0.75, ob.h * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
      const ph = (tick * 0.015 + ob.pulse) % 1;
      ctx.fillStyle = `rgba(116,185,255,${0.8 * (1 - ph)})`;
      ctx.beginPath();
      ctx.arc(ob.x + ob.w * 0.3, ob.y - ob.h * 0.5 + ph * (ob.h + 10), 2, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
    case '山': {
      // Pebbles + crack
      ctx.fillStyle = 'rgba(45,52,54,0.8)';
      ctx.beginPath(); ctx.arc(ob.x - ob.w * 0.6, ob.y + ob.h * 0.5, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ob.x + ob.w * 0.65, ob.y + ob.h * 0.45, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(ob.x - ob.w * 0.3, ob.y - ob.h * 0.3);
      ctx.lineTo(ob.x, ob.y);
      ctx.lineTo(ob.x + ob.w * 0.2, ob.y - ob.h * 0.15);
      ctx.stroke();
      break;
    }
    case '地': {
      // Cracks + rising dust motes
      ctx.strokeStyle = 'rgba(178,190,195,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(ob.x - ob.w * 0.4, ob.y + ob.h * 0.35);
      ctx.lineTo(ob.x + ob.w * 0.1, ob.y + ob.h * 0.1);
      ctx.lineTo(ob.x + ob.w * 0.45, ob.y + ob.h * 0.4);
      ctx.stroke();
      for (let k = 0; k < 2; k++) {
        const ph = (tick * 0.012 + k * 0.5 + ob.pulse) % 1;
        ctx.fillStyle = `rgba(178,190,195,${0.4 * (1 - ph)})`;
        ctx.beginPath();
        ctx.arc(ob.x + Math.sin(k * 3 + ob.pulse) * ob.w * 0.5, ob.y + ob.h * 0.5 - ph * 18, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
  }
}

// Formation patterns based on trigrams (八卦阵法)
const FORMATIONS = [
  { // ☰ 天 - 一字长蛇阵 (horizontal line above)
    name: '一字长蛇阵', symbol: '☰',
    gen: (n, r) => Array.from({length: n}, (_, i) => ({ x: (i - (n-1)/2) * (r * 2 / Math.max(n-1, 1)), y: -r * 0.7 }))
  },
  { // ☱ 泽 - 偃月阵 (arc below)
    name: '偃月阵', symbol: '☱',
    gen: (n, r) => Array.from({length: n}, (_, i) => { const a = Math.PI * 0.2 + (Math.PI * 0.6) / Math.max(n-1,1) * i; return { x: Math.cos(a) * r, y: Math.abs(Math.sin(a)) * r * 0.6 + r * 0.3 }; })
  },
  { // ☲ 火 - 二龙出水阵 (left-right flank)
    name: '二龙出水阵', symbol: '☲',
    gen: (n, r) => Array.from({length: n}, (_, i) => { const side = i % 2 === 0 ? -1 : 1; const row = Math.floor(i / 2); return { x: side * r * (0.8 + row * 0.3), y: -r * 0.5 + row * r * 0.4 }; })
  },
  { // ☳ 雷 - 锋矢阵 (V formation)
    name: '锋矢阵', symbol: '☳',
    gen: (n, r) => Array.from({length: n}, (_, i) => { const row = Math.floor(i / 2); const side = i === 0 ? 0 : (i % 2 === 0 ? 1 : -1); return { x: side * (row + 1) * r * 0.35, y: -r * 0.8 + row * r * 0.35 }; })
  },
  { // ☴ 风 - 鹤翼阵 (wing spread)
    name: '鹤翼阵', symbol: '☴',
    gen: (n, r) => Array.from({length: n}, (_, i) => { const t = (i / Math.max(n-1, 1)) * 2 - 1; const wing = Math.abs(t); return { x: t * r * 1.2, y: -r * 0.5 + wing * r * 0.8 }; })
  },
  { // ☵ 水 - 方圆阵 (circle around)
    name: '方圆阵', symbol: '☵',
    gen: (n, r) => Array.from({length: n}, (_, i) => { const a = (Math.PI * 2 / n) * i - Math.PI / 2; return { x: Math.cos(a) * r, y: Math.sin(a) * r }; })
  },
  { // ☶ 山 - 雁行阵 (diagonal line)
    name: '雁行阵', symbol: '☶',
    gen: (n, r) => Array.from({length: n}, (_, i) => ({ x: (i - (n-1)/2) * r * 0.4, y: (i - (n-1)/2) * r * 0.35 - r * 0.3 }))
  },
  { // ☷ 地 - 衡轭阵 (staggered groups)
    name: '衡轭阵', symbol: '☷',
    gen: (n, r) => Array.from({length: n}, (_, i) => { const row = Math.floor(i / 3); const col = i % 3; return { x: (col - 1) * r * 0.6, y: -r * 0.6 + row * r * 0.5 + (col % 2) * r * 0.2 }; })
  }
];

function setupFormation(hex) {
  const upperIdx = Math.floor((hex.id - 1) / 8);
  currentFormation = FORMATIONS[upperIdx];
  formationPhase = 'forming';
  formationHoldTimer = 0;
  formationTimer = 0;
  formationPositions = [];
}

function assignFormationPositions() {
  if (!currentFormation) return;
  const nonBoss = enemies.filter(e => !e.type.startsWith('boss'));
  const positions = currentFormation.gen(nonBoss.length, 140);
  nonBoss.forEach((e, i) => {
    e.formationPos = { x: knight.x + positions[i].x, y: knight.y + positions[i].y };
    e.formationReady = false;
    e.attackMode = false;
  });
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

  const types = ['boss', 'bossFire', 'bossShadow', 'bossIce', 'bossPoison', 'bossThunder'];

  bossQueue.push(...types);
}

function tryDodge(e) {
  if (e.type !== 'assassin') return false;
  if (!e._dodgeCooldown) e._dodgeCooldown = 0;
  if (e._dodgeCooldown > 0) return false;
  if (Math.random() > 0.35) return false;
  const angle = Math.random() * Math.PI * 2;
  const dodgeDist = 50 + Math.random() * 30;
  e.x += Math.cos(angle) * dodgeDist;
  e.y += Math.sin(angle) * dodgeDist;
  e.x = Math.max(10, Math.min(W() - 10, e.x));
  e.y = Math.max(10, Math.min(H() - 10, e.y));
  playSound('dash');
  for (let j = 0; j < 6; j++) {
    particles.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 12, color: '#636e72', size: 2 });
  }
  addFloatingText('闪避!', e.x, e.y - 25, '#1a1a2e', 20);
  e._dodgeCooldown = 40;
  return true;
}

        <p style="color:#ccc;font-size:13px;margin-bottom:15px">冷却: ${Math.round(newCD/60)}秒</p>
        <div style="color:#888;font-size:13px;animation:pulse 1.5s infinite">点击继续...</div>
      </div>
      <style>@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }</style>
    `;
    addFloatingText(`${as.def.icon} ${as.def.name} Lv.${as.level}!`, knight.x, knight.y - 50, as.def.color, 60);
    const handler = () => {
      overlayEl.removeEventListener('click', handler);
      overlayEl.removeEventListener('touchstart', touchHandler);
      bossKillPending = false;
      passiveScreenTriggered = false;
      upgradePaused = false;
      overlayEl.style.display = 'none';
      if (pendingVictory) { pendingVictory = false; setTimeout(() => showVictoryScreen(), 200); }
      else setTimeout(() => spawnWave(), 200);
    };
    const touchHandler = (e) => { e.preventDefault(); handler(); };
    setTimeout(() => {
      overlayEl.addEventListener('click', handler);
      overlayEl.addEventListener('touchstart', touchHandler, { passive: false });
    }, 100);
  }
}

function selectActiveSkill(skill) {
  activeSkills = [{ def: skill, cooldown: 0, level: 1 }];
  addFloatingText(skill.icon + ' ' + skill.name + ' 已获得!', knight.x, knight.y - 50, skill.color, 60);
  bossKillPending = false;
  passiveScreenTriggered = false;
  upgradePaused = false;
  document.getElementById('overlay').style.display = 'none';
  if (pendingVictory) { pendingVictory = false; setTimeout(() => showVictoryScreen(), 300); }
  else setTimeout(() => spawnWave(), 300);
}

  upgradePaused = true;
  playSound('upgrade');
  const best = saveBest();
  const timeSec = Math.floor(gameTime / 60);
  const timeMin = Math.floor(timeSec / 60);
  const timeStr = `${timeMin}分${timeSec % 60}秒`;
  const overlayEl = document.getElementById('overlay');
  overlayEl.style.display = 'flex';
  overlayEl.innerHTML = `
    <h1 style="font-size:28px;color:#ffeaa7;text-shadow:0 0 20px rgba(255,221,87,0.7)">⚔ 圣剑重铸 · 王国光复 ⚔</h1>
    <div style="max-width:440px;text-align:center;color:#ccc;font-size:13px;line-height:1.8;padding:10px 18px;background:rgba(0,0,0,0.35);border:2px solid #ffeaa7;border-radius:12px;margin:10px 0">
      <p>六块碎片在掌中重聚，圣剑轰然重铸，光耀千里。</p>

      <p>恶犬们夹着尾巴逃出王国边境，圣剑之冢重归宁静。</p>
      <p style="color:#74b9ff">骑士·艾伦："下次再偷骨头，可就没这么客气了。"</p>
    </div>
    <div style="background:rgba(0,0,0,0.3);padding:12px 26px;border-radius:12px;margin:8px 0">

      <p style="font-size:14px">击杀恶犬: <span style="color:#2ed573;font-weight:bold">${totalKills}</span> | 最高连击: <span style="color:#ff6348;font-weight:bold">${maxCombo}</span> | 用时: <span style="color:#70a1ff;font-weight:bold">${timeStr}</span></p>
      <p style="color:#ffeaa7;font-size:12px">🏆 最高纪录: ${best ? best.score + ' 分 · 第 ' + best.wave + ' 波' : score + ' 分'}</p>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
      <button class="start-btn" id="btn-endless" style="margin-top:10px;padding:14px 32px;font-size:18px;background:#6c5ce7">终局·无尽模式</button>
      <button class="start-btn" id="btn-again" style="margin-top:10px;padding:14px 32px;font-size:18px">再战一次</button>
    </div>
  `;
  const goEndless = () => {
    overlayEl.style.display = 'none';
    upgradePaused = false;
    addFloatingText('终局模式启动 — 无尽的挑战开始了！', W() / 2, H() / 2 - 60, '#6c5ce7', 60);
    spawnWave();
  };
  document.getElementById('btn-endless').addEventListener('click', goEndless);
  document.getElementById('btn-endless').addEventListener('touchstart', (e) => { e.preventDefault(); goEndless(); }, { passive: false });
  document.getElementById('btn-again').addEventListener('click', () => startGame());
  document.getElementById('btn-again').addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, { passive: false });
}

function activateActiveSkill() {
  if (gameOver || upgradePaused || passivePaused || dialoguePaused) return;
  for (const as of activeSkills) {
    if (as.cooldown <= 0) {
      const lvl = as.level || 1;
      as.cooldown = Math.floor(as.def.cooldown * Math.pow(0.88, lvl - 1));
      as.def.execute(knight, lvl);
      playSound('skill');
      addFloatingText(`${as.def.icon} ${as.def.name} Lv.${lvl}!`, knight.x, knight.y - 60, as.def.color, 45);
      return;
    }
  }
  addFloatingText('技能冷却中...', knight.x, knight.y - 60, '#888', 30);
}

function switchWeapon() {
  const weaponOrder = ['sword', 'axe', 'hammer'];
  const idx = weaponOrder.indexOf(knight.weapon);
  knight.weapon = weaponOrder[(idx + 1) % weaponOrder.length];
  addFloatingText(`切换: ${WEAPONS[knight.weapon].icon} ${WEAPONS[knight.weapon].name}`, knight.x, knight.y - 50, WEAPONS[knight.weapon].color, 35);
}

function startGame() {
  overlay.style.display = 'none';
  document.getElementById('mobile-controls').style.display = 'block';
  document.getElementById('ui').style.display = 'none';
  resize();
  checkOrientation();
  if (!window._mobileInit) { window._mobileInit = true; initMobileControls(); }
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  initAudio();
  initGame();
  gameRunning = true;
  updateWeaponBtnDisplay();
  if (!window._loopStarted) { window._loopStarted = true; loop(); }
  // Story: prologue on the first run of this session, straight to battle afterwards
  if (!storyProloguePlayed) {
    storyProloguePlayed = true;
    playStory(STORY_PROLOGUE, () => { if (!gameOver) spawnWave(); });
  } else {
    spawnWave();
  }
}

function initGame() {
  knight = {
    x: W() / 2, y: H() / 2, w: 36, h: 44,
    hp: 2000, maxHp: 2000, speed: 2.6, baseSpeed: 2.6,
    dir: 0,
    attacking: false, attackTimer: 0, attackCooldown: 0,
    invincible: 0, dashCooldown: 0,
    animFrame: 0, animTimer: 0,
    buffs: { speed: 0, strength: 0, range: 0 },
    weapon: 'sword',
    atkMult: 1, rangeMult: 1, regenRate: 2, dmgReduce: 0, critChance: 0, lifesteal: 0,
    hexSpdMult: 1, _hexDOT: 0
  };
  bossQueue = [];
  upgradePaused = false;
  upgradeChoices = [];
  totalUpgrades = 0;
  refillBossQueue();
  enemies = [];
  particles = [];
  slashes = [];
  floatingTexts = [];
  powerups = [];
  projectiles = [];
  enemyProjectiles = [];
  bloodStains = [];
  score = 0;
  wave = 0;
  comboCount = 0;
  comboTimer = 0;
  maxCombo = 0;
  totalKills = 0;
  gameTime = 0;
  wavePause = 0;

  gameOver = false;

  totalPassives = 0;
  activeSkills = [];

  pendingSurrenderText = '';
  pendingSurrenderBoss = '';
  currentHexagram = null;
  hexagramEnemyMods = {};
  nextHexagram = null;
  skipPassiveThisWave = false;
  obstacles = [];
  currentFormation = null;
  formationPositions = [];
  formationPhase = 'forming';
  formationHoldTimer = 0;
  formationTimer = 0;
  pendingVictory = false;

}

function spawnEnemy(type, x, y) {
  const def = ENEMY_TYPES[type];
  const baseHp = 30 + wave * 8;
  const baseSpd = 0.9 + Math.random() * 0.4 + wave * 0.06;
  const hm = hexagramEnemyMods.hpMult || 1;
  const sm = hexagramEnemyMods.spdMult || 1;
  const dm = hexagramEnemyMods.dmgMult || 1;
  const hp = Math.floor(baseHp * def.hpMult * hm);
  const speed = Math.min(baseSpd * def.spdMult * sm, type === 'boss' ? 2 : 3.8);
  enemies.push({
    x, y, w: 32 * def.size, h: 28 * def.size,
    hp, maxHp: hp, speed, dmgMult: def.dmgMult * dm,
    attackCooldown: 0, hitFlash: 0,
    animFrame: 0, animTimer: 0,
    type, size: def.size, scoreMult: def.scoreMult,
    chargeTimer: 0, charging: false, chargeDir: { x: 0, y: 0 },
    skillCooldown: 180, teleportCooldown: 0, summonCooldown: 0,
    slowTimer: 0
  });
}

function spawnWave() {
  if (gameOver) return;
  wave++;
  playSound('wave');
  bossActive = false;
  passiveScreenTriggered = false;
  skipPassiveThisWave = false;

  // Apply hexagram for this wave
  if (currentHexagram && knight) currentHexagram.clear(knight);
  const hex = nextHexagram || HEXAGRAMS[Math.floor(Math.random() * HEXAGRAMS.length)];
  nextHexagram = null;
  hex.apply(knight);
  currentHexagram = hex;
  const hexColor = hex.type === 'buff' ? '#2ed573' : hex.type === 'debuff' ? '#e94560' : '#ffeaa7';
  addFloatingText(`${hex.symbol} ${hex.name} | ${hex.desc}`, W() / 2, H() / 2 - 80, hexColor, 90);
  spawnObstacles(hex);
  setupFormation(hex);
  setHexFx(hex);
  spawnHexagramBurst();

  // Boss every 5 waves (from queue, no repeats until all shown)
  if (wave % 5 === 0) {
    if (bossQueue.length === 0) refillBossQueue();
    const bossType = bossQueue.shift();
    const bossDef = ENEMY_TYPES[bossType];
    const side = Math.floor(Math.random() * 4);
    let bx, by;
    if (side === 0) { bx = -50; by = H() / 2; }
    else if (side === 1) { bx = W() + 50; by = H() / 2; }
    else if (side === 2) { bx = W() / 2; by = -50; }
    else { bx = W() / 2; by = H() + 50; }
    spawnEnemy(bossType, bx, by);
    bossActive = true;
    screenShake = 12;
    playSound('boss');
    addFloatingText(`!! BOSS !! ${bossDef.name} 降临 !!`, W() / 2, H() / 2 - 60, bossDef.color, 90);
    // Chapter intro dialogue (once per session per boss)
    const chap = STORY_CHAPTERS[bossType];
    if (chap && !storyChaptersPlayed[bossType]) {
      storyChaptersPlayed[bossType] = true;
      const numCN = ['一', '二', '三', '四', '五', '六'][Math.min(bossKillCount, 5)];
      playStory(chap.intro.map((l, idx) => idx === 0 ? Object.assign({ chapter: `第${numCN}章 · ${chap.title}` }, l) : l));
    }
  }

  const count = 4 + wave * 2;
  for (let i = 0; i < count; i++) {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = -30; y = Math.random() * H(); }
    else if (side === 1) { x = W() + 30; y = Math.random() * H(); }
    else if (side === 2) { x = Math.random() * W(); y = -30; }
    else { x = Math.random() * W(); y = H() + 30; }

    // Enemy type distribution based on wave
    let type = 'normal';
    const roll = Math.random();
    if (wave >= 2 && roll < 0.15 + wave * 0.018) type = 'fast';
    else if (wave >= 3 && roll < 0.06 + wave * 0.012) type = 'tank';
    else if (wave >= 3 && roll > 0.88 - wave * 0.012) type = 'shooter';
    else if (wave >= 4 && roll > 0.78 - wave * 0.01 && roll <= 0.88 - wave * 0.012) type = 'healer';
    else if (wave >= 4 && roll > 0.68 - wave * 0.01 && roll <= 0.78 - wave * 0.01) type = 'bomber';
    else if (wave >= 5 && roll > 0.60 - wave * 0.008 && roll <= 0.68 - wave * 0.01) type = 'assassin';

    spawnEnemy(type, x, y);
  }

  const normalCount = enemies.filter(e => e.type !== 'boss').length;
  const bossText = bossActive ? ' + BOSS!' : '';
  addFloatingText(`第 ${wave} 波！${normalCount} 只恶犬来袭${bossText}`, W() / 2, H() / 2 - 50, '#e94560', 60);
  if (currentFormation) {
    addFloatingText(`${currentFormation.symbol} ${currentFormation.name}`, W() / 2, H() / 2 - 20, '#ffeaa7', 70);
    assignFormationPositions();
  }

  // Wave transition pause
  wavePause = 60;
}

function addFloatingText(text, x, y, color = '#fff', life = 40) {
  floatingTexts.push({ text, x, y, color, life, maxLife: life });
}

function knightAttack() {
  if (knight.attackCooldown > 0 || gameOver || dialoguePaused || upgradePaused || passivePaused) return;

  const weapon = WEAPONS[knight.weapon];
  knight.attacking = true;
  knight.attackTimer = knight.weapon === 'sword' ? 12 : knight.weapon === 'hammer' ? 18 : 8;
  playSound('swing');
  knight.attackCooldown = weapon.cooldown;

  // Find nearest enemy for sword direction only
  let nearest = null, minDist = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - knight.x, e.y - knight.y);
    if (d < minDist) { minDist = d; nearest = e; }
  }

  let angle = [0, Math.PI/2, Math.PI, -Math.PI/2][knight.dir];
  if (knight.weapon === 'sword' && nearest) {
    angle = Math.atan2(nearest.y - knight.y, nearest.x - knight.x);
  }
  // Update facing direction
  if (angle > -Math.PI/4 && angle <= Math.PI/4) knight.dir = 0;
  else if (angle > Math.PI/4 && angle <= 3*Math.PI/4) knight.dir = 1;
  else if (angle > 3*Math.PI/4 || angle <= -3*Math.PI/4) knight.dir = 2;
  else knight.dir = 3;

  if (knight.weapon === 'sword') {
    // === SWORD: melee sweep ===
    const slashSize = knight.buffs.range > 0 ? 1.8 : 1;
    slashes.push({ x: knight.x, y: knight.y, angle, life: 10, maxLife: 10, size: slashSize });

    const baseRange = knight.buffs.range > 0 ? 126 : 70;
    const range = Math.floor(baseRange * (knight.rangeMult || 1));
    for (const e of enemies) {
      const d = Math.hypot(e.x - knight.x, e.y - knight.y);
      const ea = Math.atan2(e.y - knight.y, e.x - knight.x);
      let diff = Math.abs(ea - angle);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;
      if (d < range && diff < Math.PI / 2.5) {
        if (tryDodge(e)) continue;
        let baseDmg = 15 + Math.floor(Math.random() * 10);
        if (knight.buffs.strength > 0) baseDmg = Math.floor(baseDmg * 1.8);
        let dmg = Math.floor(baseDmg * (knight.atkMult || 1));
        let isCrit = false;
        if (knight.critChance > 0 && Math.random() < knight.critChance) {
          dmg = Math.floor(dmg * 2);
          isCrit = true;
        }
        e.hp -= dmg;
        if (knight.lifesteal > 0) {
          const heal = Math.floor(dmg * knight.lifesteal);
          knight.hp = Math.min(knight.maxHp, knight.hp + heal);
        }
        e.hitFlash = 8;
        screenShake = 4;
        playSound('hit');

        comboCount++;
        comboTimer = 90;
        const comboMult = Math.min(comboCount, 5);
        const totalDmg = dmg * comboMult;
        if (comboCount > 1) {
          addFloatingText(`${comboCount}连击! x${comboMult}`, e.x, e.y - 30, '#ffdd57');
        }
        addFloatingText(`-${totalDmg}${isCrit ? ' 暴击!' : ''}`, e.x, e.y - 10, isCrit ? '#ffeaa7' : '#ff4757');

        const kb = 15;
        e.x += Math.cos(ea) * kb;
        e.y += Math.sin(ea) * kb;

        for (let i = 0; i < 6; i++) {
          const a = ea + (Math.random() - 0.5) * 1.5;
          const s = 2 + Math.random() * 3;
          particles.push({
            x: e.x, y: e.y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 20 + Math.random() * 15,
            color: Math.random() > 0.5 ? '#e94560' : '#ff6b81',
            size: 2 + Math.random() * 3
          });
        }
      }
    }
  } else if (knight.weapon === 'axe') {
    // === AXE: auto-aim at nearest enemy, nerfed damage ===
    if (nearest) {
      angle = Math.atan2(nearest.y - knight.y, nearest.x - knight.x);
      if (angle > -Math.PI/4 && angle <= Math.PI/4) knight.dir = 0;
      else if (angle > Math.PI/4 && angle <= 3*Math.PI/4) knight.dir = 1;
      else if (angle > 3*Math.PI/4 || angle <= -3*Math.PI/4) knight.dir = 2;
      else knight.dir = 3;
    }
    const buffRangeMult = knight.buffs.range > 0 ? 1.5 : 1;
    const spdMult = knight.buffs.strength > 0 ? 1.8 : 1;
    projectiles.push({
      x: knight.x, y: knight.y,
      vx: Math.cos(angle) * 7, vy: Math.sin(angle) * 7,
      angle, rotation: 0,
      damage: Math.floor((12 + Math.floor(Math.random() * 8)) * spdMult),
      life: Math.floor(90 * buffRangeMult * (knight.rangeMult || 1)),
      piercing: true,
      hitSet: new Set(),
      size: 1
    });
    for (let i = 0; i < 5; i++) {
      const a = angle + Math.PI + (Math.random() - 0.5) * 1;
      particles.push({
        x: knight.x, y: knight.y,
        vx: Math.cos(a) * 2 + (Math.random() - 0.5),
        vy: Math.sin(a) * 2 + (Math.random() - 0.5),
        life: 12, color: '#e17055', size: 2
      });
    }
  } else {
    // === HAMMER: 360 degree AOE shockwave ===
    const baseAoeRange = knight.buffs.range > 0 ? 180 : 100;
    const aoeRange = Math.floor(baseAoeRange * (knight.rangeMult || 1));
    let baseDmg = 30 + Math.floor(Math.random() * 20);
    if (knight.buffs.strength > 0) baseDmg = Math.floor(baseDmg * 1.8);
    screenShake = 10;

    // Shockwave visual
    slashes.push({ x: knight.x, y: knight.y, angle: 0, life: 16, maxLife: 16, size: aoeRange / 50, isHammer: true });

    // Hit ALL enemies in range (360 degrees)
    for (const e of enemies) {
      const d = Math.hypot(e.x - knight.x, e.y - knight.y);
      if (d < aoeRange) {
        if (tryDodge(e)) continue;
        let dmg = Math.floor(baseDmg * (1 - d / aoeRange * 0.3) * (knight.atkMult || 1));
        let isCrit = false;
        if (knight.critChance > 0 && Math.random() < knight.critChance) {
          dmg = Math.floor(dmg * 2);
          isCrit = true;
        }
        e.hp -= dmg;
        e.hitFlash = 10;
        if (knight.lifesteal > 0) {
          const heal = Math.floor(dmg * knight.lifesteal);
          knight.hp = Math.min(knight.maxHp, knight.hp + heal);
        }
        addFloatingText(`-${dmg}${isCrit ? ' 暴击!' : ''}`, e.x, e.y - 10, isCrit ? '#ffeaa7' : '#fdcb6e');

        // Strong knockback
        const ea = Math.atan2(e.y - knight.y, e.x - knight.x);
        const kb = 30 * (1 - d / aoeRange * 0.5);
        e.x += Math.cos(ea) * kb;
        e.y += Math.sin(ea) * kb;
      }
    }

    // Ground crack particles
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * aoeRange * 0.8;
      particles.push({
        x: knight.x + Math.cos(a) * dist,
        y: knight.y + Math.sin(a) * dist,
        vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1,
        life: 20 + Math.random() * 15,
        color: Math.random() > 0.5 ? '#fdcb6e' : '#e17055',
        size: 3 + Math.random() * 4
      });
    }
    // Dust ring
    for (let i = 0; i < 12; i++) {
      const a = (Math.PI * 2 / 12) * i;
      particles.push({
        x: knight.x + Math.cos(a) * 15, y: knight.y + Math.sin(a) * 15,
        vx: Math.cos(a) * 4, vy: Math.sin(a) * 4,
        life: 15, color: '#95a5a6', size: 4
      });
    }
  }
}

function spawnDeathParticles(x, y, big) {
  const n = big ? 26 : 15;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * (big ? 5.5 : 4);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 30 + Math.random() * 20,
      color: big ? ['#ffdd57', '#ff9f43', '#e94560', '#ff6b81'][Math.floor(Math.random() * 4)]
                 : ['#e94560', '#ff6b81', '#ff4757', '#576574'][Math.floor(Math.random() * 4)],
      size: 3 + Math.random() * (big ? 5 : 4)
    });
  }
  // Expanding shock ring
  slashes.push({ x, y, angle: 0, life: big ? 24 : 12, maxLife: big ? 24 : 12, isRing: true, size: big ? 2.6 : 1 });
}

function spawnPowerup(x, y) {
  const types = Object.keys(POWERUP_TYPES);
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({
    x, y, type, life: 600, animTimer: 0,
    spawnAnim: 20 // spawn pop animation
  });
  // Sparkle particles on spawn
  const def = POWERUP_TYPES[type];
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 25 + Math.random() * 15,
      color: def.color, size: 2 + Math.random() * 2
    });
  }
}

function applyPowerup(type) {
  const def = POWERUP_TYPES[type];
  switch (type) {
    case 'heart':
      const healed = Math.min(150, knight.maxHp - knight.hp);
      knight.hp += healed;
      addFloatingText(`+${healed} HP`, knight.x, knight.y - 40, '#e94560', 45);
      break;
    case 'speed':
      knight.buffs.speed = 480; // 8 seconds at 60fps
      knight.speed = knight.baseSpeed * 1.6;
      addFloatingText('速度提升!', knight.x, knight.y - 40, '#2ed573', 45);
      break;
    case 'strength':
      knight.buffs.strength = 480;
      addFloatingText('力量提升!', knight.x, knight.y - 40, '#ff6348', 45);
      break;
    case 'shield':
      knight.invincible = 300; // 5 seconds
      addFloatingText('无敌护盾!', knight.x, knight.y - 40, '#3742fa', 45);
      break;
    case 'range':
      knight.buffs.range = 480;
      addFloatingText('范围提升!', knight.x, knight.y - 40, '#a55eea', 45);
      break;
  }
  // Pickup burst particles
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 3;
    particles.push({
      x: knight.x, y: knight.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 20 + Math.random() * 10,
      color: def.color, size: 3 + Math.random() * 3
    });
  }
}

function drawPowerup(x, y, type, animTimer, spawnAnim) {
  const def = POWERUP_TYPES[type];
  ctx.save();
  ctx.translate(x, y);

  // Spawn pop animation
  let scale = 1;
  if (spawnAnim > 0) {
    scale = 1 + (spawnAnim / 20) * 0.8;
    ctx.globalAlpha = 1 - spawnAnim / 30;
  }
  ctx.scale(scale, scale);

  // Floating bob
  const bob = Math.sin(animTimer * 0.08) * 4;
  const t = animTimer;

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 16, 10, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rotating glow rays
  ctx.save();
  ctx.translate(0, bob);
  ctx.rotate(t * 0.02);
  ctx.globalAlpha = 0.2 + Math.sin(t * 0.1) * 0.08;
  ctx.fillStyle = def.glow;
  for (let i = 0; i < 6; i++) {
    ctx.rotate(Math.PI / 3);
    ctx.beginPath();
    ctx.moveTo(0, -3);
    ctx.lineTo(22, 0);
    ctx.lineTo(0, 3);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Pulsing halo
  ctx.globalAlpha = 0.35 + Math.sin(t * 0.1) * 0.2;
  ctx.fillStyle = def.glow;
  ctx.beginPath();
  ctx.arc(0, bob, 17 + Math.sin(t * 0.12) * 2, 0, Math.PI * 2);
  ctx.fill();

  // Disc: dark base + colored core + rim + shine
  ctx.globalAlpha = spawnAnim > 0 ? 1 - spawnAnim / 30 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.arc(0, bob, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = def.color;
  ctx.beginPath();
  ctx.arc(0, bob, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, bob, 11, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-3.5, bob - 4.5, 4, 2.4, -0.5, 0, Math.PI * 2);
  ctx.fill();

  // Icon
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Microsoft YaHei';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const icons = { heart: '♥', speed: '⚡', strength: '⚔', shield: '🛡', range: '◎' };
  ctx.fillText(icons[type] || '?', 0, bob + 1);
  ctx.textBaseline = 'alphabetic';

  // Despawn warning (flash when about to expire)
  if (animTimer > 500) {
    ctx.globalAlpha = Math.sin(animTimer * 0.3) * 0.5 + 0.5;
  }

  ctx.restore();
}

function update() {
  if (gameOver || upgradePaused || passivePaused || dialoguePaused) return;

  // Combo timer
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }
  if (comboCount > maxCombo) maxCombo = comboCount;
  gameTime++;
  if (wavePause > 0) wavePause--;
  updateHexAmbient();

  // Knight movement
  let dx = 0, dy = 0;
  if (mobileMode && joystickActive) {
    dx = joystickDX;
    dy = joystickDY;
    // Dead zone
    if (Math.hypot(dx, dy) < 0.15) { dx = 0; dy = 0; }
  } else {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
  }
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    knight.x += (dx / len) * knight.speed * (knight.hexSpdMult || 1);
    knight.y += (dy / len) * knight.speed * (knight.hexSpdMult || 1);
    if (Math.abs(dx) > Math.abs(dy)) knight.dir = dx > 0 ? 0 : 2;
    else knight.dir = dy > 0 ? 1 : 3;
    knight.animTimer++;
    if (knight.animTimer > 8) { knight.animTimer = 0; knight.animFrame = (knight.animFrame + 1) % 4; }
  }
  knight.x = Math.max(20, Math.min(W() - 20, knight.x));
  knight.y = Math.max(20, Math.min(H() - 20, knight.y));
  // Obstacle collision
  for (const ob of obstacles) {
    const halfW = ob.w / 2, halfH = ob.h / 2;
    const closestX = Math.max(ob.x - halfW, Math.min(knight.x, ob.x + halfW));
    const closestY = Math.max(ob.y - halfH, Math.min(knight.y, ob.y + halfH));
    const overlapX = knight.x - closestX;
    const overlapY = knight.y - closestY;
    const overlapDist = Math.hypot(overlapX, overlapY);
    if (overlapDist < 18) {
      if (overlapDist > 0.1) {
        knight.x = closestX + (overlapX / overlapDist) * 18;
        knight.y = closestY + (overlapY / overlapDist) * 18;
      } else {
        knight.x += 2;
      }
    }
    // Zone effects
    if (Math.abs(knight.x - ob.x) < halfW + 15 && Math.abs(knight.y - ob.y) < halfH + 15) {
      if (ob.dmg > 0 && knight.invincible <= 0 && gameTime % 30 === 0) {
        const dmg = Math.floor(ob.dmg * (1 - (knight.dmgReduce || 0)));
        knight.hp -= dmg;
        addFloatingText(`-${dmg}`, knight.x, knight.y - 30, '#e17055', 30);
        if (knight.hp <= 0) { knight.hp = 0; gameOver = true; showGameOver(); }
      }
      if (ob.slow > 0) {
        knight.x -= (knight.x - ob.x) * 0.02;
        knight.y -= (knight.y - ob.y) * 0.02;
      }
    }
  }
  if (knight.attackTimer > 0) knight.attackTimer--;
  if (knight.attackCooldown > 0) knight.attackCooldown--;
  if (knight.invincible > 0) knight.invincible--;
  if (knight.attacking && knight.attackTimer <= 0) knight.attacking = false;

  // HP regen
  if (gameTime % 60 === 0) {
    if (knight.hp < knight.maxHp) knight.hp = Math.min(knight.maxHp, knight.hp + (knight.regenRate || 2));
    if (knight._hexDOT > 0) { knight.hp -= knight._hexDOT; if (knight.hp <= 0) { knight.hp = 0; gameOver = true; showGameOver(); } }
  }

  // Speed trail particles
  if (knight.buffs.speed > 0 && (dx || dy)) {
    if (Math.random() < 0.4) {
      particles.push({
        x: knight.x + (Math.random() - 0.5) * 10,
        y: knight.y + (Math.random() - 0.5) * 10,
        vx: -dx * 0.5 + (Math.random() - 0.5), vy: -dy * 0.5 + (Math.random() - 0.5),
        life: 12, color: '#2ed573', size: 2 + Math.random() * 2
      });
    }
  }

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hitFlash > 0) e.hitFlash--;
    e.animTimer++;
    if (e.animTimer > 6) { e.animTimer = 0; e.animFrame = (e.animFrame + 1) % 4; }

    if (e.hp <= 0) {
      spawnDeathParticles(e.x, e.y, e.type && e.type.startsWith('boss'));
      playSound('kill');
      // Bomber: explode on death
      if (e.type === 'bomber') {
        const boomRange = 100;
        screenShake = 10;
        addFloatingText('爆炸!', e.x, e.y - 40, '#e67e22', 35);
        if (Math.hypot(e.x - knight.x, e.y - knight.y) < boomRange && knight.invincible <= 0) {
          const boomDmg = Math.floor(20 * (e.dmgMult || 1) * wave * 0.35 * (1 - (knight.dmgReduce || 0)));
          knight.hp -= boomDmg;
          knight.invincible = 30;
          addFloatingText(`-${boomDmg}`, knight.x, knight.y - 30, '#e67e22');
        }
        for (let j = 0; j < 20; j++) {
          const a = Math.random() * Math.PI * 2;
          const s = 2 + Math.random() * 4;
          particles.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 20 + Math.random()*15, color: ['#e67e22','#f39c12','#e74c3c'][Math.floor(Math.random()*3)], size: 4 + Math.random()*3 });
        }
      }
      // Blood stain on ground
      bloodStains.push({ x: e.x, y: e.y, size: 15 + e.size * 10, alpha: 0.4, life: 1200, rot: Math.random() * Math.PI,
        blobs: Array.from({ length: 3 }, () => ({ ox: (Math.random() - 0.5) * 26, oy: (Math.random() - 0.5) * 14, r: 2.5 + Math.random() * 4, rot: Math.random() * Math.PI })) });
      const killScore = Math.floor(10 * (e.scoreMult || 1) * Math.min(comboCount || 1, 5));
      score += killScore;
      totalKills++;
      addFloatingText(`+${killScore}`, e.x, e.y - 40, '#2ed573');
      // Boss kill bonus
      if (e.type && e.type.startsWith('boss')) {
        score += 100;
        addFloatingText(`BOSS击杀! +100`, e.x, e.y - 60, '#ffdd57', 60);
        screenShake = 15;
        // Boss surrender story
        const bossSurrender = [
          'dzw: "爸爸饶命！我再也不敢了！"',
          'dzw: "爸爸别打了...我认输！"',
          'dzw: "呜呜...爸爸太强了！"',
          'dzw: "爸爸！我是你失散多年的儿子啊！"',
          'dzw: "爸爸...我错了...汪~"',
          'dzw: "爸爸威武！dzw跪了！"',
          'dzw: "投降！爸爸天下第一！"',
          'dzw: "爸爸求放过...我给你叼拖鞋！"',
          'dzw: "爸爸！我以后都听你的！汪汪！"',
          'dzw: "爸爸...你是我见过最帅的骑士！"',
        ];
        const bossIdx = Math.min(totalUpgrades, bossSurrender.length - 1);
        pendingSurrenderText = bossSurrender[bossIdx];
        pendingSurrenderBoss = ENEMY_TYPES[e.type].name;
        for (let k = 0; k < 3; k++) spawnPowerup(e.x + (Math.random()-0.5)*40, e.y + (Math.random()-0.5)*40);
        // Story: fragment recovered + surrender gag, then upgrade chain
        const chapOut = STORY_CHAPTERS[e.type];
        const outroLines = [];
        const chapNum = Math.min(bossKillCount, 5);
        if (chapOut) outroLines.push({ who: '旁白', face: '📜', color: '#aaa', text: chapOut.outro });
        outroLines.push({ who: pendingSurrenderBoss, face: '🐕', color: '#e94560', text: pendingSurrenderText });
        if (bossKillCount >= 5) pendingVictory = true; // 6th boss down → finale after upgrade chain
        bossKillPending = true;
        skipPassiveThisWave = true;
        playStory(outroLines, () => { setTimeout(() => showUpgradeScreen(), 300); });
      }
      // Chance to drop powerup
      if (Math.random() < 0.3) spawnPowerup(e.x, e.y);
      // Kill streak announcements
      if (totalKills === 10) addFloatingText('初露锋芒! 10杀!', W()/2, H()/2 - 80, '#ffdd57', 60);
      if (totalKills === 50) addFloatingText('势不可挡! 50杀!', W()/2, H()/2 - 80, '#ff6348', 60);
      if (totalKills === 100) addFloatingText('百人斩!!', W()/2, H()/2 - 80, '#e94560', 80);
      if (totalKills === 200) addFloatingText('杀神降临!!!', W()/2, H()/2 - 80, '#ff0000', 100);
      enemies.splice(i, 1);
      continue;
    }

    // === Formation-based movement ===
    const dx2 = knight.x - e.x;
    const dy2 = knight.y - e.y;
    const dist = Math.hypot(dx2, dy2);
    const isBoss = e.type.startsWith('boss');
    if (wavePause <= 0) {
      let effectiveSpeed = e.speed;
      if (e.slowTimer > 0) { effectiveSpeed *= 0.5; e.slowTimer--; }
      let moveX = 0, moveY = 0;

      if (!isBoss && e.formationPos && !e.attackMode) {
        // Phase 1: Move to formation position
        const fdx = e.formationPos.x - e.x;
        const fdy = e.formationPos.y - e.y;
        const fDist = Math.hypot(fdx, fdy);
        if (fDist > 10) {
          moveX = (fdx / fDist) * effectiveSpeed * 2.2;
          moveY = (fdy / fDist) * effectiveSpeed * 2.2;
        } else {
          e.formationReady = true;
          // Formation line particle
          if (gameTime % 30 === 0) {
            particles.push({ x: e.x, y: e.y, vx: 0, vy: -0.3, life: 20, color: '#ffeaa7', size: 1.5 });
          }
        }
        // Type-specific modifiers during formation movement
        if (e.type === 'fast' && !e._zigzag) { e._zigzag = Math.random() * Math.PI * 2; }
        if (e.type === 'fast') {
          e._zigzag += 0.12;
          moveX += Math.sin(e._zigzag) * effectiveSpeed * 0.4;
          moveY += Math.cos(e._zigzag) * effectiveSpeed * 0.4;
        }
      } else if (!isBoss && e.attackMode) {
        // Phase 3: Attack mode - close in on knight
        if (dist > 25) {
          moveX = (dx2 / dist) * effectiveSpeed * 0.8;
          moveY = (dy2 / dist) * effectiveSpeed * 0.8;
          // Type-specific attack behaviors
          if (e.type === 'fast') {
            if (!e._zigzag) e._zigzag = Math.random() * Math.PI * 2;
            e._zigzag += 0.15;
            moveX += Math.sin(e._zigzag) * effectiveSpeed * 0.6;
            moveY += Math.cos(e._zigzag) * effectiveSpeed * 0.6;
            if (!e._dashCooldown) e._dashCooldown = 60;
            if (e._dashCooldown > 0) e._dashCooldown--;
            if (e._dashCooldown <= 0 && dist < 180 && dist > 40) {
              moveX *= 2.5; moveY *= 2.5;
              e._dashCooldown = 90 + Math.floor(Math.random() * 60);
              for (let j = 0; j < 4; j++) particles.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 10, color: '#f39c12', size: 2 });
            }
          }
          if (e.type === 'tank') {
            if (!e._chargeState) { e._chargeState = 'approach'; e._chargeCooldown = 120; }
            if (e._chargeCooldown > 0) e._chargeCooldown--;
            if (e._chargeState === 'approach' && e._chargeCooldown <= 0 && dist < 220 && dist > 50) {
              e._chargeState = 'charging'; e._chargeDir = { x: dx2/dist, y: dy2/dist }; e._chargeTimer = 25; e._chargeCooldown = 180;
            }
            if (e._chargeState === 'charging') {
              moveX = e._chargeDir.x * effectiveSpeed * 3.5; moveY = e._chargeDir.y * effectiveSpeed * 3.5;
              e._chargeTimer--;
              if (e._chargeTimer <= 0) e._chargeState = 'approach';
              if (gameTime % 3 === 0) particles.push({ x: e.x, y: e.y, vx: -e._chargeDir.x*2, vy: -e._chargeDir.y*2, life: 12, color: '#636e72', size: 3 });
            }
          }
        }
      } else {
        // Boss or enemies without formation: direct chase
        if (dist > 25) {
          moveX = (dx2 / dist) * effectiveSpeed;
          moveY = (dy2 / dist) * effectiveSpeed;
        }
      }

      e.x += moveX;
      e.y += moveY;
    }
    // Obstacle collision for enemies
    for (const ob of obstacles) {
      const halfW = ob.w / 2, halfH = ob.h / 2;
      const closestX = Math.max(ob.x - halfW, Math.min(e.x, ob.x + halfW));
      const closestY = Math.max(ob.y - halfH, Math.min(e.y, ob.y + halfH));
      const ox = e.x - closestX, oy = e.y - closestY;
      const od = Math.hypot(ox, oy);
      const eR = (e.size || 1) * 14;
      if (od < eR && od > 0.1) {
        e.x = closestX + (ox / od) * eR;
        e.y = closestY + (oy / od) * eR;
      }
    }

    // Shooter: stay at distance, strafe, burst fire when threatened (attack mode only)
    if (e.type === 'shooter' && wavePause <= 0 && (e.attackMode || isBoss)) {
      const preferredDist = 180;
      if (dist < preferredDist - 30) {
        // Retreat aggressively + strafe sideways
        const retreatSpeed = dist < 80 ? 2.0 : 1.2;
        e.x -= (dx2 / dist) * e.speed * retreatSpeed;
        e.y -= (dy2 / dist) * e.speed * retreatSpeed;
        // Strafe while retreating
        const strafeDir = (gameTime % 120 < 60) ? 1 : -1;
        e.x += (-dy2 / dist) * e.speed * 0.8 * strafeDir;
        e.y += (dx2 / dist) * e.speed * 0.8 * strafeDir;
      } else if (dist > preferredDist + 50) {
        e.x += (dx2 / dist) * e.speed;
        e.y += (dy2 / dist) * e.speed;
      } else {
        // At preferred range: strafe sideways
        const strafeDir = (gameTime % 160 < 80) ? 1 : -1;
        e.x += (-dy2 / dist) * e.speed * 0.5 * strafeDir;
        e.y += (dx2 / dist) * e.speed * 0.5 * strafeDir;
      }
      // Normal shot
      if (e.attackCooldown <= 0 && dist < 350) {
        const shootAngle = Math.atan2(knight.y - e.y, knight.x - e.x);
        enemyProjectiles.push({
          x: e.x, y: e.y,
          vx: Math.cos(shootAngle) * 4, vy: Math.sin(shootAngle) * 4,
          damage: Math.floor((6 + wave * 1.5) * (e.dmgMult || 1)),
          life: 120
        });
        e.attackCooldown = 90 + Math.floor(Math.random() * 40);
        for (let j = 0; j < 3; j++) {
          const a = shootAngle + (Math.random() - 0.5) * 0.5;
          particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, life: 8, color: '#7bed9f', size: 2 });
        }
      }
      // Burst fire when knight gets too close
      if (!e._burstCooldown) e._burstCooldown = 0;
      if (e._burstCooldown > 0) e._burstCooldown--;
      if (dist < 100 && e._burstCooldown <= 0) {
        const burstAngle = Math.atan2(knight.y - e.y, knight.x - e.x);
        for (let b = 0; b < 3; b++) {
          const spread = burstAngle + (b - 1) * 0.25;
          enemyProjectiles.push({
            x: e.x, y: e.y,
            vx: Math.cos(spread) * 5, vy: Math.sin(spread) * 5,
            damage: Math.floor((8 + wave * 1.5) * (e.dmgMult || 1)),
            life: 80
          });
        }
        e._burstCooldown = 120;
        addFloatingText('齐射!', e.x, e.y - 25, '#3d5c3a', 20);
      }
    }

    // Healer: heal nearby allies periodically + regen aura (always active, but retreat only in attack mode)
    if (e.type === 'healer' && wavePause <= 0) {
      const healerAttackMode = e.attackMode || isBoss;
      if (e.skillCooldown > 0) e.skillCooldown--;
      if (e.skillCooldown <= 0) {
        let healed = 0;
        for (const other of enemies) {
          if (other === e) continue;
          const hd = Math.hypot(other.x - e.x, other.y - e.y);
          if (hd < 150 && other.hp < other.maxHp) {
            const healAmt = Math.floor(other.maxHp * 0.12);
            other.hp = Math.min(other.maxHp, other.hp + healAmt);
            healed++;
            for (let j = 0; j < 4; j++) {
              particles.push({ x: other.x, y: other.y, vx: (Math.random()-0.5)*2, vy: -1-Math.random(), life: 20, color: '#2ed573', size: 2 });
            }
          }
        }
        if (healed > 0) {
          addFloatingText('治疗!', e.x, e.y - 30, '#2ed573', 30);
          for (let j = 0; j < 8; j++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({ x: e.x + Math.cos(a)*15, y: e.y + Math.sin(a)*15, vx: Math.cos(a)*1.5, vy: Math.sin(a)*1.5, life: 20, color: '#27ae60', size: 2 });
          }
        }
        e.skillCooldown = 150;
      }
      // Passive regen aura: small heal to nearby allies every 60 frames
      if (gameTime % 60 === 0) {
        for (const other of enemies) {
          if (other === e) continue;
          if (Math.hypot(other.x - e.x, other.y - e.y) < 100 && other.hp < other.maxHp) {
            other.hp = Math.min(other.maxHp, other.hp + Math.floor(other.maxHp * 0.03));
            if (Math.random() < 0.3) {
              particles.push({ x: other.x, y: other.y, vx: 0, vy: -0.5, life: 15, color: '#00b894', size: 1.5 });
            }
          }
        }
        // Aura visual
        if (gameTime % 30 === 0) {
          const a = Math.random() * Math.PI * 2;
          particles.push({ x: e.x + Math.cos(a)*25, y: e.y + Math.sin(a)*25, vx: Math.cos(a)*0.5, vy: Math.sin(a)*0.5, life: 20, color: '#00b894', size: 1.5 });
        }
      }
      // Healer stays at medium range (attack mode only)
      if (healerAttackMode && dist < 120) {
        e.x -= (dx2 / dist) * e.speed * 1.5;
        e.y -= (dy2 / dist) * e.speed * 1.5;
      }
    }

    // Bomber: rush toward knight, frenzy when low HP (attack mode only)
    if (e.type === 'bomber' && wavePause <= 0 && (e.attackMode || isBoss)) {
      const hpRatio = e.hp / e.maxHp;
      const rushMult = hpRatio < 0.3 ? 2.8 : hpRatio < 0.6 ? 2.2 : 1.8;
      if (dist < 200) {
        e.x += (dx2 / dist) * e.speed * rushMult;
        e.y += (dy2 / dist) * e.speed * rushMult;
      }
      // Pulsing glow (faster when low HP)
      const pulseRate = hpRatio < 0.3 ? 3 : hpRatio < 0.6 ? 6 : 10;
      if (gameTime % pulseRate === 0) {
        const pColor = hpRatio < 0.3 ? '#e74c3c' : '#e67e22';
        particles.push({ x: e.x + (Math.random()-0.5)*10, y: e.y + (Math.random()-0.5)*10, vx: 0, vy: 0, life: 15, color: pColor, size: hpRatio < 0.3 ? 3 : 2 });
      }
      // Warning text when about to explode
      if (hpRatio < 0.3 && gameTime % 60 === 0) {
        addFloatingText('!!', e.x, e.y - 20, '#e74c3c', 15);
      }
    }

    // Assassin: dodge cooldown always active, teleport/approach only in attack mode
    if (e.type === 'assassin' && wavePause <= 0) {
      if (e.skillCooldown > 0) e.skillCooldown--;
      if (e._dodgeCooldown > 0) e._dodgeCooldown--;
      if ((e.attackMode || isBoss) && e.skillCooldown <= 0 && dist > 80 && dist < 300) {
        // Teleport behind knight
        const behind = Math.atan2(e.y - knight.y, e.x - knight.x);
        const newX = knight.x + Math.cos(behind) * 40;
        const newY = knight.y + Math.sin(behind) * 40;
        for (let j = 0; j < 8; j++) {
          particles.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 15, color: '#1a1a2e', size: 3 });
        }
        e.x = newX; e.y = newY;
        for (let j = 0; j < 8; j++) {
          particles.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 15, color: '#636e72', size: 3 });
        }
        e.skillCooldown = 300 + Math.floor(Math.random() * 120);
      }
      // Approach quickly (attack mode only)
      if ((e.attackMode || isBoss) && dist > 35) {
        e.x += (dx2 / dist) * e.speed * 1.3;
        e.y += (dy2 / dist) * e.speed * 1.3;
      }
    }

    // === BOSS SKILLS ===
    if (e.type && e.type.startsWith('boss') && wavePause <= 0) {
      if (e.skillCooldown > 0) e.skillCooldown--;

      // Enrage at low HP (once per boss)
      if (!e.enraged && e.hp > 0 && e.hp < e.maxHp * 0.3) {
        e.enraged = true;
        e.speed *= 1.3;
        e.dmgMult = (e.dmgMult || 1) * 1.15;
        addFloatingText('狂暴!', e.x, e.y - 50 * e.size, '#ff0000', 40);
        screenShake = 8;
        playSound('boss');
        for (let k = 0; k < 14; k++) {
          const a = Math.random() * Math.PI * 2;
          particles.push({ x: e.x + Math.cos(a) * 20, y: e.y + Math.sin(a) * 20, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 20, color: ['#ff4757', '#ff6b81'][Math.floor(Math.random() * 2)], size: 3 });
        }
      }

      // DZW王: Charge attack - dash toward knight
      if (e.type === 'boss' && e.skillCooldown <= 0 && dist < 300 && dist > 60) {
        const chargeAngle = Math.atan2(knight.y - e.y, knight.x - e.x);
        e.charging = true;
        e.chargeDir = { x: Math.cos(chargeAngle) * 8, y: Math.sin(chargeAngle) * 8 };
        e.chargeTimer = 20;
        e.skillCooldown = 240;
        addFloatingText('冲锋!', e.x, e.y - 40 * e.size, '#ff0000', 30);
        screenShake = 6;
      }
      if (e.charging) {
        e.x += e.chargeDir.x;
        e.y += e.chargeDir.y;
        e.chargeTimer--;
        // Trail particles
        particles.push({
          x: e.x + (Math.random()-0.5)*10, y: e.y + (Math.random()-0.5)*10,
          vx: 0, vy: 0, life: 12, color: '#e74c3c', size: 3
        });
        // Charge hit
        if (Math.hypot(e.x - knight.x, e.y - knight.y) < 35 && knight.invincible <= 0) {
          const chargeDmg = Math.floor(20 * (e.dmgMult || 1) * (1 - (knight.dmgReduce || 0)));
          knight.hp -= chargeDmg;
          knight.invincible = 40;
          screenShake = 10;
          addFloatingText(`-${chargeDmg}`, knight.x, knight.y - 30, '#ff0000');
        }
        if (e.chargeTimer <= 0) e.charging = false;
      }

      // DZW炎: Fireball spread (5 fireballs in a cone)
      if (e.type === 'bossFire' && e.skillCooldown <= 0 && dist < 350) {
        const baseAngle = Math.atan2(knight.y - e.y, knight.x - e.x);
        for (let k = -2; k <= 2; k++) {
          const fa = baseAngle + k * 0.25;
          enemyProjectiles.push({
            x: e.x, y: e.y,
            vx: Math.cos(fa) * 5, vy: Math.sin(fa) * 5,
            damage: Math.floor(10 * (e.dmgMult || 1)),
            life: 100, color: '#e74c3c', size: 8
          });
        }
        e.skillCooldown = 150;
        addFloatingText('烈焰喷射!', e.x, e.y - 40 * e.size, '#e74c3c', 30);
        screenShake = 5;
        for (let k = 0; k < 8; k++) {
          const a = baseAngle + (Math.random()-0.5)*1;
          particles.push({
            x: e.x, y: e.y, vx: Math.cos(a)*3, vy: Math.sin(a)*3,
            life: 15, color: '#e74c3c', size: 3
          });
        }
      }

      // DZW影: Teleport near knight + summon minions
      if (e.type === 'bossShadow') {
        if (e.teleportCooldown > 0) e.teleportCooldown--;
        if (e.summonCooldown > 0) e.summonCooldown--;
        // Teleport
        if (e.teleportCooldown <= 0 && dist > 150) {
          const tAngle = Math.random() * Math.PI * 2;
          const tDist = 60 + Math.random() * 40;
          // Disappear particles
          for (let k = 0; k < 10; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
              x: e.x, y: e.y, vx: Math.cos(a)*2, vy: Math.sin(a)*2,
              life: 15, color: '#2c3e50', size: 3
            });
          }
          e.x = knight.x + Math.cos(tAngle) * tDist;
          e.y = knight.y + Math.sin(tAngle) * tDist;
          // Appear particles
          for (let k = 0; k < 10; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
              x: e.x, y: e.y, vx: Math.cos(a)*2, vy: Math.sin(a)*2,
              life: 15, color: '#7f8c8d', size: 3
            });
          }
          e.teleportCooldown = 300;
          addFloatingText('瞬移!', e.x, e.y - 40 * e.size, '#7f8c8d', 25);
        }
        // Summon minions
        if (e.summonCooldown <= 0 && enemies.filter(en => en.type !== 'boss' && en.type !== 'bossFire' && en.type !== 'bossShadow' && en.type !== 'bossIce').length < 8) {
          for (let k = 0; k < 2; k++) {
            const sa = Math.random() * Math.PI * 2;
            spawnEnemy('fast', e.x + Math.cos(sa)*40, e.y + Math.sin(sa)*40);
          }
          e.summonCooldown = 360;
          addFloatingText('召唤仆从!', e.x, e.y - 40 * e.size, '#2c3e50', 35);
        }
      }

      // DZW冰: Freeze aura - slows knight when close
      if (e.type === 'bossIce' && e.skillCooldown <= 0 && dist < 200) {
        // Shoot ice projectiles in all directions
        for (let k = 0; k < 8; k++) {
          const ia = (Math.PI * 2 / 8) * k;
          enemyProjectiles.push({
            x: e.x, y: e.y,
            vx: Math.cos(ia) * 4, vy: Math.sin(ia) * 4,
            damage: Math.floor(8 * (e.dmgMult || 1)),
            life: 80, color: '#74b9ff', size: 6
          });
        }
        // Slow effect
        if (dist < 150 && knight.buffs.speed <= 0) {
          knight.speed = knight.baseSpeed * 0.5;
          setTimeout(() => { if (knight.buffs.speed <= 0) knight.speed = knight.baseSpeed; }, 2000);
        }
        e.skillCooldown = 180;
        addFloatingText('冰霜爆发!', e.x, e.y - 40 * e.size, '#74b9ff', 30);
        screenShake = 5;
        // Ice particles
        for (let k = 0; k < 12; k++) {
          const a = (Math.PI * 2 / 12) * k;
          particles.push({
            x: e.x + Math.cos(a)*20, y: e.y + Math.sin(a)*20,
            vx: Math.cos(a)*3, vy: Math.sin(a)*3,
            life: 20, color: '#74b9ff', size: 3
          });
        }
      }

      // DZW毒: Poison cloud + poison trail
      if (e.type === 'bossPoison' && e.skillCooldown <= 0 && dist < 300) {
        for (let k = 0; k < 6; k++) {
          const pa = Math.random() * Math.PI * 2;
